<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contencioso · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Contencioso V2 · protótipo do redesenho de navegação
   Tokens copiados do staging (16/11/2026): cores, status, raios, fontes e sombras. */
:root{
  --brand-50:#eff6fd;--brand-100:#ddedff;--brand-200:#badbfe;--brand-300:#8ebff3;--brand-400:#5e9ad6;
  --brand-500:#3675b2;--brand-600:#295e90;--brand-700:#1f4a73;--brand-800:#153758;--brand-900:#0f2840;--brand-950:#071727;
  --on-brand:#fcfcfc;
  --bg:#f9fafb;--surface:#fff;--surface-2:#f4f5f7;--border:#dfe1e4;--border-strong:#c7cbd0;
  --fg:#14191f;--fg-muted:#555b63;--fg-subtle:#5f646a;--ring:var(--brand-500);
  --shadow-1:0 1px 2px #10171f0f,0 1px 1px #10171f0a;--shadow-2:0 8px 24px #10171f1a,0 2px 6px #10171f0f;
  --positive:#00682c;--negative:#b71824;--caution:#7d4a07;
  --state-created:#5c646f;--state-processing:#006c9e;--state-needs_documents:#81520a;--state-needs_review:#a83a00;
  --state-calculated:#6d47b8;--state-approved:#006e3a;--state-guide_requested:#006d7c;--state-guide_ready:#00675e;
  --state-paid:#006915;--state-archived:#5f6469;
  --r-control:10px;--r-card:12px;--ease:cubic-bezier(.2,.8,.2,1);
  --font:"Inter","Inter Variable",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono","JetBrains Mono Variable",ui-monospace,SFMono-Regular,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1015;--surface:#14191f;--surface-2:#1d2229;--border:#2b3138;--border-strong:#414851;
  --fg:#eff2f5;--fg-muted:#a7abb1;--fg-subtle:#90969d;--ring:var(--brand-400);
  --shadow-1:0 1px 2px #0006;--shadow-2:0 8px 24px #00000080,0 2px 6px #00000059;
  --positive:#5ac576;--negative:#f97770;--caution:#edb345;
  --state-created:#9ca5b1;--state-processing:#5abdf2;--state-needs_documents:#f3b94c;--state-needs_review:#ff995c;
  --state-calculated:#b89eff;--state-approved:#63d18f;--state-guide_requested:#5fc9db;--state-guide_ready:#63ccc0;
  --state-paid:#7bd77f;--state-archived:#94999e;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1015;--surface:#14191f;--surface-2:#1d2229;--border:#2b3138;--border-strong:#414851;
  --fg:#eff2f5;--fg-muted:#a7abb1;--fg-subtle:#90969d;--ring:var(--brand-400);
  --shadow-1:0 1px 2px #0006;--shadow-2:0 8px 24px #00000080,0 2px 6px #00000059;
  --positive:#5ac576;--negative:#f97770;--caution:#edb345;
  --state-created:#9ca5b1;--state-processing:#5abdf2;--state-needs_documents:#f3b94c;--state-needs_review:#ff995c;
  --state-calculated:#b89eff;--state-approved:#63d18f;--state-guide_requested:#5fc9db;--state-guide_ready:#63ccc0;
  --state-paid:#7bd77f;--state-archived:#94999e;color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
[id]{scroll-margin-top:72px}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
.muted{color:var(--fg-muted)}.subtle{color:var(--fg-subtle)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
svg.lucide{width:16px;height:16px;stroke-width:2;flex-shrink:0}

/* ---------- casca ---------- */
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:var(--r-control);border:1px solid var(--border)}
.skip:focus{left:8px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100dvh}
.app.with-panel{grid-template-columns:240px 1fr 420px}
.sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:12px;background:var(--surface);border-right:1px solid var(--border);padding:0 12px 16px}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;font-weight:600}
.brand .logo{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--brand-600);color:var(--on-brand);font-size:12px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-control);color:var(--fg-muted);font-size:14px;line-height:20px}
.nav a:hover{color:var(--fg)}
.nav a.active{background:var(--surface-2);color:var(--fg)}
.nav .count{margin-left:auto;font-size:12px;font-weight:500;padding:0 7px;border-radius:999px;background:color-mix(in oklch,var(--state-needs_review) 14%,transparent);color:var(--state-needs_review)}
.sidebar .foot{margin-top:auto;padding:0 12px;font-weight:600;letter-spacing:.3em;color:var(--fg-muted);font-size:12px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--bg) 80%,transparent);backdrop-filter:blur(12px)}
.icon-btn.menu-btn{display:none}
.search-btn{display:flex;align-items:center;gap:8px;width:360px;max-width:100%;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);color:var(--fg-subtle);text-align:left}
.search-btn kbd{margin-left:auto}
.search-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--fg-subtle)}
.topbar .spacer{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-control);border:0;background:transparent;color:var(--fg-muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.user{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:999px;background:transparent}
.avatar{display:grid;place-items:center;width:26px;height:26px;border-radius:999px;background:var(--brand-600);color:var(--on-brand);font-size:11px;font-weight:600;flex-shrink:0}
.avatar.sm{width:22px;height:22px;font-size:10px}
.avatar.sys{background:var(--surface-2);color:var(--fg-muted);border:1px solid var(--border)}
.content{padding:24px 32px 64px;max-width:1240px}
.proto-note{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fg-subtle);margin-bottom:16px}

/* ---------- componentes ---------- */
h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em;margin:0}
h1.mono{font-size:20px;line-height:28px;letter-spacing:-.5px}
h2{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px 0}
.card-b{padding:16px 20px 20px}
.card-h p{margin:2px 0 0;font-size:12px;color:var(--fg-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r-control);border:1px solid var(--border-strong);background:var(--surface);font-size:12px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-1);transition:background .15s var(--ease),transform .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand-600);border-color:var(--brand-600);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-700)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--negative)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.lg{height:36px;font-size:13px;padding:0 14px}
.link{color:var(--brand-400);font-weight:500;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0}
:root:not([data-theme="dark"]) .link{color:var(--brand-600)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--brand-300)}}
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:999px;padding:2px 10px;font-size:12px;line-height:16px;font-weight:500;color:var(--c,var(--fg-muted));background:color-mix(in oklch,var(--c,var(--fg-muted)) 12%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.plain::before{display:none}
.badge.outline{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--c) 45%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:transparent;font-size:12px;color:var(--fg-muted)}
.chip .n{color:var(--fg-subtle)}
.chip.on{border-color:var(--brand-500);background:color-mix(in oklch,var(--brand-500) 14%,transparent);color:var(--fg)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--fg-muted)}
.tag.client{border-color:color-mix(in oklch,var(--brand-400) 50%,transparent);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg-muted)}
.input,.select{height:36px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);color:var(--fg);padding:0 10px;font:inherit;font-size:13px}
.input:focus,.select:focus{outline:2px solid var(--ring);outline-offset:0}
.help{font-size:12px;color:var(--fg-subtle)}
.err{font-size:12px;color:var(--negative)}
.row{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sep{height:1px;background:var(--border);margin:16px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.kv dt{font-size:12px;color:var(--fg-subtle)}
.kv dd{margin:2px 0 0;font-weight:500}
.money{font-family:var(--font);font-variant-numeric:tabular-nums;font-weight:600}
.big{font-size:22px;letter-spacing:-.01em}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-card);border:1px solid color-mix(in oklch,var(--c,var(--brand-400)) 40%,var(--border));background:color-mix(in oklch,var(--c,var(--brand-400)) 8%,var(--surface))}
.callout .lucide{color:var(--c,var(--brand-400));margin-top:2px}
.callout p{margin:2px 0 0;color:var(--fg-muted);font-size:13px}

/* tabela */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;text-align:left;font-weight:500;font-size:12px;color:var(--fg-subtle);background:var(--surface-2);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in oklch,var(--surface-2) 60%,transparent)}
td .mono a{color:var(--brand-400)}
:root:not([data-theme="dark"]) td .mono a{color:var(--brand-600)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) td .mono a{color:var(--brand-300)}}
.num{text-align:right;white-space:nowrap}

/* abas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:24px;overflow-x:auto}
.tabs a{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px;color:var(--fg-muted);white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-selected="true"]{color:var(--fg);font-weight:500}
.tabs a[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand-400)}
.tabs .cnt{font-size:11px;font-weight:500;padding:0 6px;border-radius:99px;background:var(--surface-2);color:var(--fg-muted)}
.tabs .cnt.alert{background:color-mix(in oklch,var(--state-needs_review) 16%,transparent);color:var(--state-needs_review)}
.subtabs{display:flex;gap:4px;margin:16px 0}

/* jornada */
.journey{padding:20px}
.steps{display:grid;grid-template-columns:repeat(8,1fr);position:relative}
.steps::before{content:"";position:absolute;top:13px;left:6%;right:6%;height:2px;background:var(--border)}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--fg-subtle);background:none;border:0;padding:0 4px;border-radius:8px}
.step .dot{display:grid;place-items:center;width:28px;height:28px;border-radius:99px;border:2px solid var(--border-strong);background:var(--surface);font-size:11px;font-weight:600;color:var(--fg-muted);z-index:1}
.step.done .dot{background:var(--brand-600);border-color:var(--brand-600);color:var(--on-brand)}
.step.current .dot{border-color:var(--state-needs_review);color:var(--state-needs_review);box-shadow:0 0 0 4px color-mix(in oklch,var(--state-needs_review) 18%,transparent)}
.step.current{color:var(--fg);font-weight:600}
.step.locked .dot{border-style:dashed}
.step:hover .lbl{text-decoration:underline;text-underline-offset:3px}
.step .sub{font-weight:400;font-size:11px;color:var(--fg-subtle)}

/* "Agora" */
.now{display:grid;grid-template-columns:1fr auto;gap:20px;padding:18px 20px;border-top:1px solid var(--border)}
.now .who{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;font-size:12px;color:var(--fg-subtle)}
.now .who b{color:var(--fg);font-size:13px}
.now .lead{font-size:15px;font-weight:600}
.now .why{margin:4px 0 12px;color:var(--fg-muted)}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px}
.mode.person{color:var(--state-needs_review);background:color-mix(in oklch,var(--state-needs_review) 12%,transparent)}
.mode.system{color:var(--state-processing);background:color-mix(in oklch,var(--state-processing) 12%,transparent)}
.mode.wait{color:var(--fg-muted);background:var(--surface-2)}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}

/* checklist para aprovar */
.check{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--border)}
.check:first-child{border-top:0}
.check .ic{display:grid;place-items:center;width:24px;height:24px;border-radius:99px;flex-shrink:0}
.check .ic.bad{color:var(--state-needs_review);background:color-mix(in oklch,var(--state-needs_review) 14%,transparent)}
.check .ic.ok{color:var(--positive);background:color-mix(in oklch,var(--positive) 14%,transparent)}
.check .ic.info{color:var(--fg-muted);background:var(--surface-2)}
.check h3{font-size:13px}
.check p{margin:2px 0 8px;color:var(--fg-muted);font-size:13px}
.choice{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-control);margin-top:6px;cursor:pointer}
.choice:has(input:checked){border-color:var(--brand-500);background:color-mix(in oklch,var(--brand-500) 8%,transparent)}

/* fila */
.queue-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--border)}
.queue-item:hover{background:color-mix(in oklch,var(--surface-2) 60%,transparent)}
.queue-item .t{font-size:13px;font-weight:600}
.queue-item .r{font-size:13px;color:var(--fg-muted)}
.queue-item .meta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--fg-subtle);flex-wrap:wrap}
.funnel{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.funnel span{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--fg-muted)}
.legend a{display:inline-flex;gap:6px;align-items:center}
.legend i{width:8px;height:8px;border-radius:99px;display:inline-block}
.legend b{color:var(--fg)}

/* verbas */
details.verba{border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface)}
details.verba+details.verba{margin-top:8px}
details.verba summary{list-style:none;display:grid;grid-template-columns:auto 1fr repeat(4,110px);gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
details.verba summary::-webkit-details-marker{display:none}
details.verba[open] summary .chev{transform:rotate(90deg)}
details.verba .in{padding:0 16px 16px;border-top:1px solid var(--border)}
.lbl-s{font-size:11px;color:var(--fg-subtle);display:block}
.quote{border-left:2px solid var(--border-strong);padding:4px 12px;margin:8px 0;font-family:var(--mono);font-size:12px;color:var(--fg-muted)}
.fl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg)}
.fl:hover{border-color:var(--brand-400)}

/* painel lateral (chat e folha) */
.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column}
.side[hidden]{display:none}
.side-h{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 16px;border-bottom:1px solid var(--border)}
.side-h h2{font-size:14px}
.side-b{flex:1;overflow:auto;padding:16px}
.side-f{border-top:1px solid var(--border);padding:12px}
.privacy{display:flex;align-items:center;gap:8px;font-size:12px;padding:8px 12px;border-radius:var(--r-control);background:var(--surface-2);color:var(--fg-muted);margin-bottom:12px}
.msg{padding:10px 12px;border-radius:var(--r-control);background:var(--surface-2);margin-bottom:10px;font-size:13px}
.msg.me{background:color-mix(in oklch,var(--brand-500) 14%,transparent);margin-left:40px}
.diff{width:100%;font-size:12px;margin-top:8px}
.diff td{padding:6px 8px}
.page{background:#fff;color:#111;border-radius:6px;padding:24px 22px;font:12px/1.7 Georgia,serif;box-shadow:var(--shadow-1)}
.page mark{background:#ffe58a;color:#111;padding:0 2px}
.page .pg{font:11px var(--mono);color:#777;text-align:right;margin-bottom:8px}

/* paleta Ctrl+K e diálogos */
.overlay{position:fixed;inset:0;z-index:60;background:#0008;display:grid;place-items:start center;padding-top:12vh}
.overlay[hidden]{display:none}
.palette{width:min(620px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-2);overflow:hidden}
.palette input{width:100%;height:48px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--fg);padding:0 16px 0 44px;font:inherit;font-size:15px;outline:none}
.palette .in-wrap{position:relative}
.palette .in-wrap .lucide{position:absolute;left:16px;top:16px;color:var(--fg-subtle)}
.palette .res{max-height:420px;overflow:auto;padding:6px}
.palette .grp{font-size:11px;color:var(--fg-subtle);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
.palette a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px}
.palette a[aria-selected="true"],.palette a:hover{background:var(--surface-2)}
.palette .empty{padding:24px;text-align:center;color:var(--fg-muted)}
.dialog{width:min(480px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-2);padding:20px}
.dialog p{color:var(--fg-muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-control);font-size:13px;box-shadow:var(--shadow-2)}
.toast[hidden]{display:none}
.menu{position:absolute;right:0;top:36px;z-index:40;min-width:240px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-control);box-shadow:var(--shadow-2);padding:6px}
.menu[hidden]{display:none}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:8px;font-size:13px}
.menu button:hover{background:var(--surface-2)}
.menu small{display:block;color:var(--fg-subtle);font-size:11px}

/* uploads */
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--r-card);padding:28px;text-align:center;background:var(--surface)}
.thumb{width:84px;height:110px;border-radius:6px;background:#fff;color:#333;font:7px/1.4 Georgia,serif;padding:8px;overflow:hidden;box-shadow:var(--shadow-1);flex-shrink:0}
.sugg{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-control);margin-top:6px;cursor:pointer;font-size:13px}
.sugg:has(input:checked){border-color:var(--brand-500);background:color-mix(in oklch,var(--brand-500) 8%,transparent)}

/* ---------- camada "O que mudou" (anotação do protótipo, fora da identidade de propósito) ---------- */
:root{--note:#a21caf;--note-bg:#fdf4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--note:#f0abfc;--note-bg:#3b0a3f}}
:root[data-theme="dark"]{--note:#f0abfc;--note-bg:#3b0a3f}
.chg{display:none;align-items:center;gap:4px;height:20px;padding:0 8px;margin:0 4px;border-radius:999px;border:1px dashed var(--note);background:var(--note-bg);color:var(--note);font:600 11px/1 var(--font);white-space:nowrap;vertical-align:middle;cursor:pointer}
.chg svg.lucide{width:12px;height:12px}
.show-chg .chg{display:inline-flex}
.chg-toggle{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:1px dashed var(--note);background:var(--note-bg);color:var(--note);font-size:12px;font-weight:600}
.chg-toggle[aria-pressed="false"]{background:transparent;opacity:.75}
.chg-pop{position:absolute;z-index:80;width:min(380px,92vw);background:var(--surface);border:1px solid var(--note);border-radius:var(--r-card);box-shadow:var(--shadow-2);padding:14px 16px;font-size:13px}
.chg-pop[hidden]{display:none}
.chg-pop h3{color:var(--note);display:flex;gap:6px;align-items:center;margin-bottom:8px}
.chg-pop dl{margin:0;display:grid;gap:8px}
.chg-pop dt{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-subtle)}
.chg-pop dd{margin:2px 0 0}
.chg-pop .antes{color:var(--fg-muted)}
.chg-list a{display:block;padding:10px 0;border-top:1px solid var(--border)}
.chg-list b{color:var(--note)}
.chg-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:16px;border-radius:var(--r-control);border:1px dashed var(--note);background:var(--note-bg);font-size:13px}
.chg-banner[hidden]{display:none}
.chg-target{outline:2px dashed var(--note);outline-offset:4px;border-radius:8px}

.term{border-bottom:1px dotted var(--fg-subtle);cursor:help}
.term:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.term-pop{position:absolute;z-index:85;max-width:300px;background:var(--fg);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.45;box-shadow:var(--shadow-2)}
.term-pop[hidden]{display:none}
.chip[disabled]{opacity:.45;cursor:default}
.quicknav{display:none;gap:6px;overflow-x:auto;margin:14px 0 4px;padding-bottom:2px}
.quicknav a{flex-shrink:0;height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--fg-muted)}

/* ---------- responsivo ---------- */
@media (max-width:1100px){.app.with-panel{grid-template-columns:240px 1fr}.app.with-panel .side{position:fixed;right:0;top:0;width:min(420px,100vw);z-index:50;box-shadow:var(--shadow-2)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:55;width:260px;transform:translateX(-100%);transition:transform .2s var(--ease)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-2)}
  .icon-btn.menu-btn{display:inline-grid}
  .search-btn{width:auto;flex:1;min-width:0}
  .topbar .spacer{display:none}
  .search-btn kbd,.user .nm{display:none}
  .chg-toggle span{display:none}
  .content{padding:16px 16px 48px}
  .grid2{grid-template-columns:1fr}
  .steps{display:flex;overflow-x:auto;gap:4px;scroll-snap-type:x mandatory;padding-bottom:4px}
  .steps::before{display:none}
  .step{min-width:84px;scroll-snap-align:center}
  .now{grid-template-columns:1fr}
  .now .who{align-items:flex-start;text-align:left}
  details.verba summary{grid-template-columns:auto 1fr auto}
  details.verba summary .hide-sm{display:none}
  .queue-item{grid-template-columns:1fr;gap:8px}
  .hide-sm{display:none}
  table.responsive thead{display:none}
  table.responsive tr{display:block;padding:12px;border-bottom:1px solid var(--border)}
  table.responsive td{display:block;position:relative;border:0;padding:4px 0 4px 112px;text-align:left;min-height:26px}
  table.responsive td::before{content:attr(data-l);position:absolute;left:0;top:6px;width:104px;color:var(--fg-subtle);font-size:12px}
  table.responsive td.num{text-align:left}
  .quicknav{display:flex}
  .order-sm-first{order:-1}
}

/* processo.html */

  .head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
  .totals{display:flex;gap:24px;text-align:right}
  .totals dt{font-size:12px;color:var(--fg-subtle)}.totals dd{margin:0}
  .ask-fab{position:fixed;right:20px;bottom:20px;z-index:20;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);box-shadow:var(--shadow-2);font-size:13px;font-weight:500}
  .with-panel .ask-fab,.with-panel .chg-fab{display:none}
  .with-panel .head{grid-template-columns:1fr}.with-panel .totals{text-align:left}
  .with-panel .steps .sub{display:none}
  .mobile-bar{display:none}
  .phase{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .phase .card{padding:14px 16px;box-shadow:none}
  .mm{width:100%;font-size:12px;margin-top:6px}.mm th{position:static}
  @media (max-width:820px){.head{grid-template-columns:1fr}.totals{text-align:left}
    .mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow-2)}
    .mobile-bar .btn{flex:1;height:40px}.mobile-bar .btn.icon{flex:0 0 40px;padding:0}.ask-fab,.chg-fab{display:none}.content{padding-bottom:96px}}

<body>
<!-- Contencioso V2 · protótipo do redesenho da navegação (16/11/2026). Arquivo único: as telas Painel, Processos, Processo e Uploads estão embutidas e a navegação usa o endereço depois do "#". Precisa de internet só para fontes e ícones. -->
<script>window.PAGES = {"index.html": {"title": "Painel · Contencioso", "tpl": "\n  <div class=\"proto-note\"><i data-lucide=\"flask-conical\"><\/i>Protótipo do redesenho · números de processo e tribunais do staging de 16/11/2026; nomes de pessoas fictícios; motivos, responsáveis e valores ilustrativos.<\/div>\n  <div class=\"row\" style=\"justify-content:space-between;flex-wrap:wrap;gap:16px\">\n    <div><h1>Olá, Mariana<\/h1><p class=\"muted\" id=\"sub\" style=\"margin:4px 0 0\"><\/p><\/div>\n    <label class=\"field\" style=\"flex-direction:row;align-items:center;gap:8px\">Ver a fila de\n      <select class=\"select\" id=\"role\" aria-label=\"Ver a fila de qual papel\">\n        <option value=\"helena\">Aprovação (Helena Duarte)<\/option>\n        <option value=\"rafael\">Conferência (Rafael Moura)<\/option>\n        <option value=\"thiago\">Conferência (Thiago Lopes)<\/option>\n        <option value=\"bruna\">Entrada de documentos (Bruna Martins)<\/option>\n        <option value=\"todos\">Toda a equipe<\/option>\n      <\/select><\/label>\n  <\/div>\n\n  <nav class=\"quicknav\" aria-label=\"Atalhos do Painel\"><a href=\"#qT\">Sua fila<\/a><a href=\"#eT\">Com quem está<\/a><a href=\"#cT\">Carteira por cliente<\/a><a href=\"#jT\">Jornada<\/a><\/nav>\n  <section class=\"card\" style=\"margin-top:20px\" aria-labelledby=\"qT\">\n    <div class=\"card-h\"><div><h2 id=\"qT\">O que espera por você <span data-c=\"painel-fila\"><\/span><\/h2><p>Cada item diz o motivo e leva direto ao lugar de resolver.<\/p><\/div><span class=\"spacer\" style=\"flex:1\"><\/span><span class=\"money big\" id=\"qN\"><\/span><\/div>\n    <div id=\"queue\" style=\"margin-top:12px\"><\/div>\n  <\/section>\n\n  <div class=\"grid2\" style=\"margin-top:16px\">\n    <section class=\"card\" aria-labelledby=\"eT\">\n      <div class=\"card-h\"><div><h2 id=\"eT\">Com quem está cada processo <span data-c=\"painel-comquem\"><\/span><\/h2><p>Quem precisa agir e quantos processos estão com cada pessoa.<\/p><\/div><\/div>\n      <div class=\"card-b\" id=\"team\"><\/div>\n    <\/section>\n    <section class=\"card\" aria-labelledby=\"cT\">\n      <div class=\"card-h\"><div><h2 id=\"cT\">Carteira por cliente <span data-c=\"painel-carteira\" data-l=\"Novo\"><\/span><\/h2><p>Provisão (estimativa antes da sentença) separada da condenação.<\/p><\/div><\/div>\n      <div class=\"card-b\" style=\"padding-top:8px\"><div class=\"table-wrap\" style=\"border:0\"><table class=\"responsive\" id=\"carteira\"><\/table><\/div><\/div>\n    <\/section>\n  <\/div>\n\n  <section class=\"card\" style=\"margin-top:16px\" aria-labelledby=\"jT\">\n    <div class=\"card-h\"><div><h2 id=\"jT\">Jornada dos processos <span data-c=\"painel-funil\"><\/span><\/h2><p>Quantos processos há em cada etapa. Clique para ver a lista.<\/p><\/div><span style=\"flex:1\"><\/span><a class=\"btn\" href=\"processos.html\">Ver todos <i data-lucide=\"arrow-right\"><\/i><\/a><\/div>\n    <div class=\"card-b\"><div class=\"funnel\" id=\"funnel\"><\/div><div class=\"legend\" id=\"legend\"><\/div><\/div>\n  <\/section>\n", "js": "\nconst { $, esc, money, badge, person, valueTag, clientTag, icons, shell, myQueue, D } = UI;\nshell(\"Painel\");\nconst ACTION = { needs_review: [\"Resolver\", \"wrench\"], needs_documents: [\"Enviar documento\", \"upload\"], calculated: [\"Conferir e aprovar\", \"badge-check\"] };\nconst TAB = { needs_review: \"calculo\", needs_documents: \"documentos\", calculated: \"calculo\" };\nfunction item(p) {\n  const [lbl, ic] = ACTION[p.estado];\n  return `<div class=\"queue-item\">\n    ${person(p.resp, false)}\n    <div style=\"min-width:0\"><div class=\"t\"><a href=\"processo.html?id=${p.id}\"><span class=\"mono\">${p.numero}<\/span><\/a> · <span class=\"muted\" style=\"font-weight:400\">${esc(p.autor)}<\/span><\/div>\n      <div class=\"r\">${esc(p.motivo)}<\/div>\n      <div class=\"meta\">${badge(p.estado)} ${clientTag(p)} ${valueTag(p)} ${p.valor != null && p.tipo !== \"none\" ? `<span class=\"money\">${money(p.valor)}<\/span>` : \"\"} <span>· ${D.TEAM[p.resp].nome}, ${p.data.slice(0, 5)}<\/span><\/div><\/div>\n    <a class=\"btn ${p.estado === \"calculated\" ? \"primary\" : \"\"}\" href=\"processo.html?id=${p.id}&aba=${TAB[p.estado]}\"><i data-lucide=\"${ic}\"><\/i>${lbl}<\/a><\/div>`;\n}\nfunction uploadItem(u) {\n  return `<div class=\"queue-item\">${person(u.por, false)}\n    <div><div class=\"t\">Arquivo sem processo ${UI.chg(\"painel-upload\")} · <span class=\"muted\" style=\"font-weight:400\">${esc(u.nome)}<\/span><\/div>\n    <div class=\"r\">O sistema não achou o número do processo no texto. Sugestão: Camila Rezende Porto (4035231-09).<\/div>\n    <div class=\"meta\"><span class=\"badge\" style=\"--c:var(--state-needs_documents)\">Aguardando sua escolha<\/span><span>· enviado por ${D.TEAM[u.por].nome}, ${u.enviado.slice(0, 5)}<\/span><\/div><\/div>\n    <a class=\"btn\" href=\"uploads.html\"><i data-lucide=\"link\"><\/i>Escolher processo<\/a><\/div>`;\n}\nfunction render() {\n  const role = $(\"#role\").value;\n  const q = myQueue().filter((p) => role === \"todos\" || p.resp === role).sort((a, b) => (a.estado === \"calculated\" ? -1 : 1) - (b.estado === \"calculated\" ? -1 : 1) || b.sort.localeCompare(a.sort));\n  const ups = role === \"bruna\" || role === \"todos\" ? D.UPLOADS_PENDENTES : [];\n  $(\"#queue\").innerHTML = (ups.map(uploadItem).join(\"\") + q.map(item).join(\"\")) || `<div class=\"card-b muted\">Nada esperando por você agora.<\/div>`;\n  $(\"#qN\").textContent = q.length + ups.length;\n  const apr = myQueue().filter((p) => p.estado === \"calculated\").length;\n  $(\"#sub\").textContent = role === \"helena\" ? `${apr} memórias conferidas aguardam sua aprovação · 1 prazo vence em 20/11` : `${q.length + ups.length} itens nesta fila`;\n  icons();\n}\n// com quem está\nconst groups = {};\nD.procs.forEach((p) => { (groups[p.resp] ||= []).push(p); });\n$(\"#team\").innerHTML = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([k, ps]) => {\n  const t = D.TEAM[k];\n  const why = k === \"sistema\" ? \"Provisões feitas, aguardando a sentença chegar aos autos\" : [...new Set(ps.map((p) => D.STATES[p.estado].label))].join(\" · \");\n  return `<div class=\"row\" style=\"padding:10px 0;border-top:1px solid var(--border)\">${person(k, false)}<div style=\"flex:1;min-width:0\"><b>${t.nome}<\/b> <span class=\"subtle\">· ${t.papel}<\/span><div class=\"help\">${why}<\/div><\/div><span class=\"money\">${ps.length}<\/span><\/div>`;\n}).join(\"\").replace('border-top:1px solid var(--border)', '');\n// carteira por cliente\nconst byC = {};\nD.procs.forEach((p) => { const c = p.cliente || p.sugestao || \"Sem cliente\"; const o = (byC[c] ||= { n: 0, prov: 0, cond: 0, conf: 0 }); o.n++; if (!p.cliente) o.conf++; if (p.tipo === \"prov\") o.prov += p.valor || 0; if (p.tipo === \"cond\") o.cond += p.valor || 0; });\n$(\"#carteira\").innerHTML = `<thead><tr><th>Cliente<\/th><th class=\"num\">Processos<\/th><th class=\"num\">Provisão<\/th><th class=\"num\">Condenação<\/th><\/tr><\/thead><tbody>` +\n  Object.entries(byC).sort((a, b) => b[1].n - a[1].n).map(([c, o]) => `<tr><td data-l=\"Cliente\"><a class=\"link\" href=\"processos.html?cliente=${encodeURIComponent(c)}\">${esc(c === \"Sem cliente\" ? \"Título e cliente não identificados\" : c)}<\/a>${o.conf && c !== \"Sem cliente\" ? `<div class=\"help\" style=\"color:var(--state-needs_review)\">${o.conf} com a cliente a confirmar<\/div>` : \"\"}<\/td><td class=\"num\" data-l=\"Processos\">${o.n}<\/td><td class=\"num money\" data-l=\"Provisão\"><a class=\"link\" href=\"processos.html?cliente=${encodeURIComponent(c)}&valor=prov\" aria-label=\"Ver as provisões de ${esc(c)}\">${money(o.prov)}<\/a><\/td><td class=\"num money\" data-l=\"Condenação\"><a class=\"link\" href=\"processos.html?cliente=${encodeURIComponent(c)}&valor=cond\" aria-label=\"Ver as condenações de ${esc(c)}\">${money(o.cond)}<\/a><\/td><\/tr>`).join(\"\") + `<\/tbody>`;\n// funil compacto\nconst order = [\"needs_documents\", \"processing\", \"needs_review\", \"provision\", \"calculated\", \"approved\"];\nconst cnt = (s) => D.procs.filter((p) => p.estado === s).length;\n$(\"#funnel\").innerHTML = order.filter(cnt).map((s) => `<span style=\"flex:${cnt(s)};background:${D.STATES[s].c}\" title=\"${D.STATES[s].label}: ${cnt(s)}\"><\/span>`).join(\"\");\n$(\"#legend\").innerHTML = order.map((s) => `<a href=\"processos.html?estado=${s}\"><i style=\"background:${D.STATES[s].c}\"><\/i>${D.STATES[s].label} <b>${cnt(s)}<\/b><\/a>`).join(\"\") + `<a href=\"#\"><i style=\"background:var(--state-guide_requested)\"><\/i>Guia pedida <b>0<\/b><\/a><a href=\"#\"><i style=\"background:var(--state-paid)\"><\/i>Pago <b>0<\/b><\/a>`;\n$(\"#role\").onchange = render; render();\n"}, "processos.html": {"title": "Processos · Contencioso", "tpl": "\n  <div class=\"row\" style=\"justify-content:space-between;flex-wrap:wrap;gap:12px\">\n    <h1>Processos<\/h1>\n    <div class=\"row\"><button class=\"btn\" id=\"csv\"><i data-lucide=\"download\"><\/i>Exportar CSV<\/button><a class=\"btn primary\" href=\"uploads.html\"><i data-lucide=\"upload\"><\/i>Enviar documentos<\/a><\/div>\n  <\/div>\n  <div class=\"row\" style=\"margin-top:20px;flex-wrap:wrap;gap:12px\">\n    <label class=\"sr-only\" for=\"q\">Buscar processos<\/label>\n    <div style=\"position:relative;flex:1;min-width:260px;max-width:440px\"><i data-lucide=\"search\" style=\"position:absolute;left:10px;top:10px;color:var(--fg-subtle)\"><\/i>\n      <input class=\"input\" id=\"q\" type=\"search\" placeholder=\"Número (pode ser só um pedaço), parte ou cliente\" style=\"width:100%;padding-left:34px\"><\/div><span data-c=\"lista-busca\"><\/span>\n    <label class=\"field\" style=\"flex-direction:row;align-items:center;gap:8px\">Cliente\n      <select class=\"select\" id=\"cliente\"><option value=\"\">Todas<\/option><\/select><\/label><span data-c=\"lista-cliente\" data-l=\"Novo\"><\/span>\n  <\/div>\n  <div class=\"stack\" style=\"gap:10px;margin-top:14px\">\n    <div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><span class=\"help\" style=\"width:52px\">Situação<\/span><span data-c=\"estados\"><\/span><div id=\"fEstado\" class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><\/div><\/div>\n    <div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><span class=\"help\" style=\"width:52px\">Valor<\/span><span data-c=\"lista-valor\" data-l=\"Novo\"><\/span><div id=\"fValor\" class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><\/div><\/div>\n    <div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><span class=\"help\" style=\"width:52px\">Fase<\/span><div id=\"fFase\" class=\"row\" style=\"flex-wrap:wrap;gap:6px\"><\/div><\/div>\n  <\/div>\n  <p class=\"help\" id=\"hint\" style=\"margin:14px 0 8px\"><\/p>\n  <div class=\"table-wrap\"><table class=\"responsive\" id=\"tbl\"><\/table><\/div>\n  <p class=\"help\" id=\"count\" style=\"margin-top:10px\"><\/p>\n", "js": "\nconst { $, esc, money, badge, person, valueTag, clientTag, icons, shell, toast, D } = UI;\nshell(\"Processos\");\nconst P = new URLSearchParams(window.QS);\nconst st = { q: P.get(\"q\") || \"\", cliente: P.get(\"cliente\") || \"\", estado: P.get(\"estado\") || \"\", valor: P.get(\"valor\") || \"\", fase: \"\", sort: \"data\", dir: -1 };\nconst norm = (s) => (s || \"\").normalize(\"NFD\").replace(/[̀-ͯ]/g, \"\").toLowerCase().replace(/[^a-z0-9]/g, \"\");\n$(\"#q\").value = st.q;\n$(\"#cliente\").innerHTML += D.CLIENT_NAMES.map((c) => `<option ${c === st.cliente ? \"selected\" : \"\"}>${c}<\/option>`).join(\"\");\nconst base = () => D.procs.filter((p) => {\n  const q = norm(st.q);\n  // a busca considera o nome normalizado da cliente: \"Royal Air Maroc\" acha também \"Royalair Maroc\" e \"ROYAL AIR MAROC\"\n  if (q && !(norm(p.numero).includes(q) || norm(p.titulo).includes(q) || norm(p.sugestao).includes(q))) return false;\n  if (st.cliente && p.sugestao !== st.cliente) return false;\n  return true;\n});\nfunction chips(el, key, opts) {\n  const b = base();\n  $(el).innerHTML = [[\"\", \"Todos\", b.length], ...opts.map(([v, l, f]) => [v, l, b.filter(f).length])].map(([v, l, n]) =>\n    `<button class=\"chip ${st[key] === v ? \"on\" : \"\"}\" data-v=\"${v}\" aria-pressed=\"${st[key] === v}\" ${n === 0 && st[key] !== v ? \"disabled\" : \"\"}>${l} <span class=\"n\">${n}<\/span><\/button>`).join(\"\");\n  $(el).onclick = (e) => { const c = e.target.closest(\".chip\"); if (!c) return; st[key] = c.dataset.v; render(); };\n}\nconst COLS = [[\"numero\", \"Número\"], [\"partes\", \"Partes e cliente\"], [\"estado\", \"Situação\"], [\"resp\", \"Com quem\"], [\"valor\", \"Valor\"], [\"data\", \"Última mudança\"]];\nfunction render() {\n  chips(\"#fEstado\", \"estado\", Object.entries(D.STATES).filter(([k]) => D.procs.some((p) => p.estado === k)).map(([k, s]) => [k, s.label, (p) => p.estado === k]));\n  chips(\"#fValor\", \"valor\", [[\"prov\", \"Provisão (antes da sentença)\", (p) => p.tipo === \"prov\"], [\"cond\", \"Condenação\", (p) => p.tipo === \"cond\"], [\"none\", \"Sem valor ainda\", (p) => p.tipo === \"none\"]]);\n  chips(\"#fFase\", \"fase\", [\"Inicial\", \"Sentença\", \"Execução\"].map((f) => [f, f, (p) => p.fase === f]));\n  let rows = base().filter((p) => (!st.estado || p.estado === st.estado) && (!st.valor || p.tipo === st.valor) && (!st.fase || p.fase === st.fase));\n  const key = { numero: (p) => p.numero, partes: (p) => p.autor, estado: (p) => p.estado, resp: (p) => D.TEAM[p.resp].nome, valor: (p) => p.valor ?? -1, data: (p) => p.sort }[st.sort];\n  rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * st.dir);\n  const hidden = st.q && D.procs.filter((p) => norm(p.titulo).includes(norm(st.q))).length < rows.length;\n  $(\"#hint\").innerHTML = hidden ? `<i data-lucide=\"info\"><\/i> A busca por \"${esc(st.q)}\" também trouxe processos em que a cliente aparece com outra grafia nos autos.` : \"\";\n  $(\"#tbl\").innerHTML = `<thead><tr>${COLS.map(([k, l]) => `<th ${k === \"valor\" ? 'class=\"num\"' : \"\"} aria-sort=\"${st.sort === k ? (st.dir > 0 ? \"ascending\" : \"descending\") : \"none\"}\"><button class=\"btn ghost\" style=\"height:auto;padding:0;font-size:12px;color:inherit\" data-k=\"${k}\">${l} <i data-lucide=\"${st.sort === k ? (st.dir > 0 ? \"arrow-up\" : \"arrow-down\") : \"arrow-up-down\"}\"><\/i><\/button><\/th>`).join(\"\")}<\/tr><\/thead><tbody>` +\n    rows.map((p) => `<tr>\n      <td data-l=\"Número\"><span class=\"mono\" style=\"font-size:12px\"><a href=\"processo.html?id=${p.id}\">${p.numero}<\/a><\/span><div class=\"help\">${p.tribunal} · ${p.fase}<\/div><\/td>\n      <td data-l=\"Partes\"><div>${esc(p.autor)}<\/div><div style=\"margin-top:4px\">${clientTag(p)}<\/div><\/td>\n      <td data-l=\"Situação\">${badge(p.estado)}<div class=\"help\" style=\"margin-top:4px;max-width:260px\">${esc(p.motivo)}<\/div><\/td>\n      <td data-l=\"Com quem\"><span class=\"row\" style=\"gap:6px\">${person(p.resp)}<span>${D.TEAM[p.resp].nome.split(\" \")[0]}<\/span><\/span><\/td>\n      <td class=\"num\" data-l=\"Valor\">${p.valor != null ? `<div class=\"money\">${money(p.valor)}<\/div>` : \"\"}<div style=\"margin-top:2px\">${valueTag(p)}<\/div><\/td>\n      <td data-l=\"Última mudança\" style=\"white-space:nowrap\">${p.data.replace(\" \", \", \")}<\/td><\/tr>`).join(\"\") + `<\/tbody>`;\n  $(\"#hint\").innerHTML += UI.chg(\"lista-situacao\", \"Mudou: colunas e ordem\");\n  $(\"#count\").textContent = `${rows.length} de ${D.procs.length} processos`;\n  history.replaceState(null, \"\", \"#/processos.html?\" + new URLSearchParams(Object.fromEntries(Object.entries({ q: st.q, cliente: st.cliente, estado: st.estado, valor: st.valor }).filter(([, v]) => v))).toString());\n  icons();\n}\n$(\"#tbl\").addEventListener(\"click\", (e) => { const b = e.target.closest(\"[data-k]\"); if (!b) return; st.dir = st.sort === b.dataset.k ? -st.dir : -1; st.sort = b.dataset.k; render(); });\n$(\"#q\").oninput = (e) => { st.q = e.target.value; render(); };\n$(\"#cliente\").onchange = (e) => { st.cliente = e.target.value; render(); };\n$(\"#csv\").onclick = () => toast(\"Protótipo: o CSV sairia com as colunas da tela, inclusive cliente, situação, responsável e tipo de valor.\");\nrender();\n"}, "processo.html": {"title": "Processo · Contencioso", "tpl": "<div id=\"root\"><\/div>", "js": "\nconst { $, $$, esc, money, badge, person, valueTag, clientTag, icons, shell, openSide, closeSide, confirmDialog, toast, D } = UI;\nshell(\"Processos\");\nconst P = new URLSearchParams(window.QS);\nconst p = UI.proc(P.get(\"id\") || 24) || UI.proc(24);\nconst aba = P.get(\"aba\") || \"visao\";\ndocument.title = p.numero + \" · Contencioso\";\nconst C = window.CASES[p.id] || generic(p);\nconst state = { cliente: p.cliente, zero: null };\n\nfunction generic(p) {\n  const map = { needs_review: 4, needs_documents: 0, calculated: 5, provision: 4 };\n  return { current: map[p.estado] ?? 2, provision: p.estado === \"provision\", steps: [\"Autos completos\", \"Concluída\", \"Sem dúvidas\", p.tipo === \"prov\" ? \"Provisão\" : \"Versão 1\", \"\", \"\", \"\", \"\"],\n    now: { mode: p.estado === \"provision\" ? \"wait\" : \"person\", lead: p.estado === \"provision\" ? \"Provisão feita · aguardando a sentença\" : D.STATES[p.estado].label, why: p.motivo, cta: [p.estado === \"needs_documents\" ? \"Enviar documento\" : p.estado === \"provision\" ? \"Ver a estimativa\" : \"Resolver\", p.estado === \"needs_documents\" ? \"documentos\" : \"calculo\", \"\"] },\n    leitura: { fase: p.fase, processual: \"—\", titulo: \"—\", desfecho: \"—\", pend: [] }, partes: [[p.autor, \"Autor(a)\", null], ...p.reus.split(/ e (?=[A-Z])/).map((r) => [r, r.match(/maroc|arajet|taag|ethiopian|finnair|westjet/i) && p.cliente ? \"Ré · cliente\" : \"Ré\", null])],\n    resumo: \"Conteúdo ilustrativo: este processo usa o modelo genérico do protótipo. Veja os processos 24, 29, 4 e 14 para os casos completos.\", timeline: [], calc: null, folhas: {}, historico: [] };\n}\n\n/* ---------- jornada: mesmos 8 passos sempre, na ordem do guia; cada passo leva ao lugar dele ---------- */\nconst STEPS = [[\"Documentos\", \"documentos\", \"\"], [\"Leitura dos autos\", \"timeline\", \"\"], [\"Revisão da leitura\", \"timeline\", \"&visao=duvidas\"], [\"Memória de cálculo\", \"calculo\", \"\"], [\"Conferência\", \"calculo\", \"#aprovar\"], [\"Aprovação\", \"calculo\", \"#aprovar\"], [\"Guia\", \"calculo\", \"#guia\"], [\"Pago\", \"historico\", \"\"]];\nfunction journey() {\n  return `<div class=\"steps\" role=\"list\" aria-label=\"Jornada do processo. Use as setas para ver os outros passos.\">${STEPS.map(([n, t, h], i) => {\n    const cls = i < C.current ? \"done\" : i === C.current ? \"current\" : C.provision && i >= 5 ? \"locked\" : \"\";\n    const sub = C.steps[i] || (C.provision && i === 5 ? \"Só com sentença\" : i > C.current ? \"próxima\" : \"\");\n    return `<a role=\"listitem\" class=\"step ${cls}\" tabindex=\"${i === C.current ? 0 : -1}\" href=\"?id=${p.id}&aba=${t}${h}\" ${i === C.current ? 'aria-current=\"step\"' : \"\"}>\n      <span class=\"dot\">${i < C.current ? '<i data-lucide=\"check\"><\/i>' : C.provision && i >= 5 ? '<i data-lucide=\"lock\"><\/i>' : i + 1}<\/span>\n      <span class=\"lbl\">${n}<\/span><span class=\"sub\">${sub}<\/span><\/a>`;\n  }).join(\"\")}<\/div>`;\n}\nfunction nowBlock() {\n  let n = C.now; const who = D.TEAM[p.resp];\n  if (C.calc?.checklist === \"cliente_zero\" && state.cliente && state.zero) n = { mode: \"person\", lead: state.zero === \"zero\" ? \"Aprove e encerre sem valor\" : \"Aprove a memória\", why: `Cliente indicada (${state.cliente}) e motivo do zero registrado. Falta só a aprovação de quem tem permissão.`, cta: [state.zero === \"zero\" ? \"Aprovar e encerrar\" : \"Aprovar\", \"calculo\", \"#aprovar\"] };\n  else if (C.calc?.checklist === \"cliente_zero\" && (state.cliente || state.zero)) n = { ...n, lead: \"Falta 1 pendência para aprovar\", cta: [\"Resolver a pendência\", \"calculo\", \"#aprovar\"] };\n  const mode = { person: ['user-round', 'Precisa de uma pessoa', 'person'], system: ['loader', 'O sistema está trabalhando', 'system'], wait: ['hourglass', 'Aguardando os autos', 'wait'] }[n.mode];\n  return `<div class=\"now\"><div>\n      <span class=\"mode ${mode[2]}\"><i data-lucide=\"${mode[0]}\"><\/i>${mode[1]}<\/span>${UI.chg(\"proc-agora\", \"Mudou: um próximo passo só\")}\n      <div class=\"lead\" style=\"margin-top:8px\">${esc(n.lead)}<\/div>\n      <p class=\"why\">${esc(n.why).replace(/memória(?! de)/, UI.term(\"memória\", \"memoria\")).replace(/estimativa/, UI.term(\"estimativa\", \"provisao\"))}<\/p>\n      <div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><a class=\"btn primary lg\" href=\"?id=${p.id}&aba=${n.cta[1]}${n.cta[2]}\" id=\"ctaMain\"><i data-lucide=\"arrow-right\"><\/i>${esc(n.cta[0])}<\/a><\/div><\/div>\n    <div class=\"who\"><span>Com quem está ${UI.chg(\"proc-comquem\")}<\/span><span class=\"row\" style=\"gap:8px\">${person(p.resp)}<b>${who.nome}<\/b><\/span><span>${who.papel} · desde ${p.data.slice(0, 5)}<\/span>\n      ${p.resp !== \"sistema\" ? `<button class=\"link\" style=\"font-size:12px\" onclick=\"UI.toast('Protótipo: escolher outra pessoa da equipe para este processo.')\">Passar para outra pessoa<\/button>` : \"\"}<\/div><\/div>`;\n}\nfunction header() {\n  const tot = C.calc?.memoria;\n  return `<a class=\"link\" href=\"processos.html\" style=\"font-size:13px\"><i data-lucide=\"chevron-left\"><\/i>Processos<\/a>\n  <div class=\"head\" style=\"margin-top:10px\"><div>\n    <div class=\"row\" style=\"flex-wrap:wrap;gap:10px\"><h1 class=\"mono\">${p.numero}<\/h1>\n      <button class=\"icon-btn\" aria-label=\"Copiar número do processo\" onclick=\"navigator.clipboard?.writeText('${p.numero}');UI.toast('Número copiado')\"><i data-lucide=\"copy\"><\/i><\/button>\n      ${badge(p.estado)}${UI.chg(\"estados\")}<\/div>\n    <div class=\"row\" style=\"flex-wrap:wrap;gap:8px;margin-top:6px\"><span>${esc(p.titulo)}<\/span><span class=\"subtle\">· ${p.tribunal}<\/span><button class=\"icon-btn\" aria-label=\"Editar título\"><i data-lucide=\"pencil\"><\/i><\/button><\/div>\n    <div class=\"row\" style=\"gap:8px;margin-top:8px\">${clientTag({ cliente: state.cliente })}${valueTag(p)}${UI.chg(\"proc-cliente-topo\")}<\/div><\/div>\n    <div class=\"row\" style=\"align-items:flex-start;gap:20px\">\n      ${tot ? `<dl class=\"totals\"><div><dt>${C.provision ? UI.term(\"Provisão estimada\", \"provisao\") : UI.term(\"Total devido\", \"total\")}<\/dt><dd class=\"money big\">${money(tot.total)}<\/dd><\/div><div><dt>${UI.term(\"Parte da cliente\", \"parte\")}<\/dt><dd class=\"money big\">${money(tot.parte)}<\/dd><\/div><\/dl>` : \"\"}\n      ${UI.chg(\"proc-mais-acoes\")}<div style=\"position:relative\"><button class=\"btn\" id=\"more\" aria-haspopup=\"menu\" aria-expanded=\"false\"><i data-lucide=\"ellipsis\"><\/i>Mais ações<\/button>\n        <div class=\"menu\" id=\"moreMenu\" role=\"menu\" hidden>\n          <button role=\"menuitem\" data-act=\"reler\"><i data-lucide=\"refresh-cw\"><\/i><span>Reler os autos<small>Lê todos os PDFs de novo. Tem custo e leva alguns minutos.<\/small><\/span><\/button>\n          <button role=\"menuitem\" data-act=\"arquivar\"><i data-lucide=\"archive\"><\/i><span>Arquivar processo<small>Sai das filas e do Painel. Dá para desfazer.<\/small><\/span><\/button>\n        <\/div><\/div><\/div><\/div>\n  <section class=\"card\" style=\"margin-top:20px\" aria-label=\"Jornada do processo\"><div class=\"journey\"><div style=\"margin:-6px 0 12px\">${UI.chg(\"proc-jornada\", \"Mudou: jornada\")}<\/div>${journey()}<\/div>${nowBlock()}<\/section>`;\n}\n\n/* ---------- abas ---------- */\nconst pendCount = C.calc?.checklist === \"cliente_zero\" ? 2 : C.calc?.checklist === \"provisao\" ? 1 : 0;\nconst TABS = [[\"visao\", \"Visão geral\"], [\"documentos\", \"Documentos\", 1, p.estado === \"needs_documents\"], [\"timeline\", \"Timeline\"], [\"calculo\", \"Cálculo\", pendCount || null, pendCount > 0], [\"historico\", \"Histórico\"]];\nfunction tabs() { return `<nav class=\"tabs\" aria-label=\"Seções do processo\">${TABS.map(([k, l, n, alert]) => `<a href=\"?id=${p.id}&aba=${k}\" aria-selected=\"${aba === k}\" ${aba === k ? 'aria-current=\"page\"' : \"\"}>${l}${n ? `<span class=\"cnt ${alert ? \"alert\" : \"\"}\">${n}<\/span>` : \"\"}<\/a>`).join(\"\")}<span style=\"align-self:center\">${UI.chg(\"proc-contadores\")}<\/span><\/nav>`; }\nconst fl = (n, t = \"fl. \" + n) => `<button class=\"fl\" data-fl=\"${n}\"><i data-lucide=\"file-text\"><\/i>${t}<\/button>`;\n\nfunction visao() {\n  const L = C.leitura;\n  const reus = C.partes.filter(([, r]) => r.startsWith(\"Ré\"));\n  return `<div class=\"grid2\" style=\"margin-top:20px\">\n    <section class=\"card\"><div class=\"card-h\"><h2>Leitura dos autos<\/h2><\/div><div class=\"card-b\">\n      <dl class=\"kv\"><div><dt>Fase<\/dt><dd>${L.fase}<\/dd><\/div><div><dt>Fase processual<\/dt><dd>${L.processual}<\/dd><\/div><div><dt>Título vigente<\/dt><dd>${L.titulo}<\/dd><\/div><div><dt>Desfecho<\/dt><dd>${L.desfecho}<\/dd><\/div><\/dl>\n      ${L.pend.length ? `<div class=\"sep\"><\/div><h3>Pendências<\/h3><ul style=\"margin:6px 0 0;padding-left:18px\">${L.pend.map((x) => `<li>${esc(x)} <a class=\"link\" href=\"?id=${p.id}&aba=${C.calc ? \"calculo#aprovar\" : \"documentos#faltam\"}\" style=\"font-size:12px\">Resolver<\/a><\/li>`).join(\"\")}<\/ul>` : \"\"}\n    <\/div><\/section>\n    <section class=\"card\" id=\"partes\"><div class=\"card-h\"><div><h2>Partes ${UI.chg(\"visao-partes\")}<\/h2><p>A cliente define quem paga a conta. Ela pode ser indicada aqui.<\/p><\/div><\/div><div class=\"card-b\">\n      ${C.partes.map(([n, r, adv]) => { const isRe = r.startsWith(\"Ré\"); const isCli = (state.cliente && n.toLowerCase().includes(state.cliente.split(\" \").pop().toLowerCase())) || r.includes(\"cliente\");\n        return `<div class=\"row\" style=\"padding:10px 0;border-top:1px solid var(--border);align-items:flex-start\"><div style=\"flex:1\"><b>${esc(n)}<\/b> <span class=\"tag\">${isRe ? \"Ré\" : r}<\/span> ${isRe && isCli ? '<span class=\"tag client\"><i data-lucide=\"briefcase\"><\/i>Cliente<\/span>' : \"\"}\n          <div class=\"help\">${adv ? \"Advogados: \" + esc(adv) : isRe ? \"Advogados não identificados nos autos\" : \"\"}<\/div><\/div>\n          ${isRe && !state.cliente ? `<button class=\"btn\" data-mark=\"${esc(n)}\"><i data-lucide=\"briefcase\"><\/i>Marcar como cliente<\/button>` : \"\"}<\/div>`; }).join(\"\")}\n      <div class=\"sep\" style=\"margin:8px 0 12px\"><\/div><div class=\"row\"><span class=\"help\" style=\"flex:1\">Responsabilidade da cliente: <b style=\"color:var(--fg)\">direta, integral<\/b> · padrão do perfil, porque os autos não dizem.<\/span><button class=\"btn ghost\">Alterar<\/button><\/div>\n    <\/div><\/section><\/div>\n    <section class=\"card\" style=\"margin-top:16px\"><div class=\"card-h\"><h2>O processo<\/h2><\/div><div class=\"card-b\"><p style=\"margin:0\">${esc(C.resumo)}<\/p><\/div><\/section>\n    ${C.timeline.length ? `<section class=\"card\" style=\"margin-top:16px\"><div class=\"card-h\"><h2>Decisões, prazos e providências ${UI.chg(\"folha-lado\", \"Mudou: folha ao lado\")}<\/h2><\/div><div class=\"card-b\">${C.timeline.slice().reverse().filter((t) => t[5]).map((t) => `<div class=\"row\" style=\"align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)\"><span class=\"mono subtle\" style=\"width:92px;font-size:12px\">${t[0]}<\/span><div style=\"flex:1\"><b>${t[2]}<\/b><div class=\"help\">${t[3]}<\/div><\/div>${fl(t[4])}<\/div>`).join(\"\")}<\/div><\/section>` : \"\"}`;\n}\n\nfunction documentos() {\n  const falta = p.estado === \"needs_documents\";\n  return `${falta ? `<section class=\"card\" id=\"faltam\" style=\"margin-top:20px\"><div class=\"card-h\"><div><h2>O que falta para a leitura continuar ${UI.chg(\"docs-falta\", \"Novo\")}<\/h2><p>O sistema compara o que a sentença pede com o que já está nos autos.<\/p><\/div><\/div><div class=\"card-b\">\n      <div class=\"check\"><span class=\"ic bad\"><i data-lucide=\"x\"><\/i><\/span><div><h3>Planilha da liquidação homologada<\/h3><p>A sentença manda apurar o valor em liquidação ${fl(211)}. Ela costuma estar nos autos depois da sentença, com o nome \"cálculos\" ou \"planilha de liquidação\".<\/p><\/div><\/div>\n      <div class=\"check\"><span class=\"ic ok\"><i data-lucide=\"check\"><\/i><\/span><div><h3>Petição inicial<\/h3><p>fls. 1–39<\/p><\/div><\/div>\n      <div class=\"check\"><span class=\"ic ok\"><i data-lucide=\"check\"><\/i><\/span><div><h3>Sentença e embargos<\/h3><p>fls. 211–245<\/p><\/div><\/div><\/div><\/section>` : \"\"}\n    <section class=\"card\" style=\"margin-top:16px\"><div class=\"card-b\"><div class=\"drop\"><i data-lucide=\"upload-cloud\" style=\"width:28px;height:28px;color:var(--brand-400)\"><\/i><h3 style=\"margin-top:8px\">Arraste os PDFs aqui<\/h3><p class=\"muted\" style=\"margin:4px 0 12px\">Eles entram direto neste processo. A leitura começa sozinha.<\/p>\n      <div class=\"row\" style=\"justify-content:center;flex-wrap:wrap\"><label class=\"field\" style=\"flex-direction:row;align-items:center\">Tipo<select class=\"select\"><option>${falta ? \"Peça avulsa: planilha de liquidação\" : \"Processo completo\"}<\/option><option>Peça avulsa<\/option><option>Planilha de contingência da cliente<\/option><\/select><\/label><button class=\"btn primary\" onclick=\"UI.toast('Protótipo: abriria a escolha de arquivos. Só PDF.')\">Escolher arquivos<\/button><\/div><\/div><\/div><\/section>\n    <section class=\"card\" style=\"margin-top:16px\"><div class=\"card-h\"><h2>Documentos do processo ${UI.chg(\"docs-linguagem\")}<\/h2><\/div><div class=\"card-b\">\n      <div class=\"row\" style=\"padding:8px 0\"><i data-lucide=\"file-text\"><\/i><div style=\"flex:1\"><b>Autos completos · parte 1<\/b><div class=\"help\">98 páginas · 13,3 MB · enviado por Bruna Martins em 29/10 · lido<\/div><\/div><button class=\"btn
