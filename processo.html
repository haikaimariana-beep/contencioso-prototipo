<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Processo · Contencioso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  .head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
  .totals{display:flex;gap:24px;text-align:right}
  .totals dt{font-size:12px;color:var(--fg-subtle)}.totals dd{margin:0}
  .ask-fab{position:fixed;right:20px;bottom:20px;z-index:20;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);box-shadow:var(--shadow-2);font-size:13px;font-weight:500}
  .with-panel .ask-fab,.with-panel .chg-fab{display:none}
  .with-panel .head{grid-template-columns:1fr}.with-panel .totals{text-align:left}
  .with-panel .steps .sub{display:none}
  .mobile-bar{display:none}
  .phase{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .phase .card{padding:14px 16px;box-shadow:none}
  .mm{width:100%;font-size:12px;margin-top:6px}.mm th{position:static}
  @media (max-width:820px){.head{grid-template-columns:1fr}.totals{text-align:left}
    .mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow-2)}
    .mobile-bar .btn{flex:1;height:40px}.mobile-bar .btn.icon{flex:0 0 40px;padding:0}.ask-fab,.chg-fab{display:none}.content{padding-bottom:96px}}
</style>
</head>
<body>
<template><div id="root"></div></template>
<script src="assets/data.js"></script>
<script src="assets/cases.js"></script>
<script src="assets/changes.js"></script>
<script src="assets/app.js"></script>
<script>
const { $, $$, esc, money, badge, person, valueTag, clientTag, icons, shell, openSide, closeSide, confirmDialog, toast, D } = UI;
shell("Processos");
const P = new URLSearchParams(location.search);
const p = UI.proc(P.get("id") || 24) || UI.proc(24);
const aba = P.get("aba") || "visao";
document.title = p.numero + " · Contencioso";
const C = window.CASES[p.id] || generic(p);
const state = { cliente: p.cliente, zero: null };

function generic(p) {
  const map = { needs_review: 4, needs_documents: 0, calculated: 5, provision: 4 };
  return { current: map[p.estado] ?? 2, provision: p.estado === "provision", steps: ["Autos completos", "Concluída", "Sem dúvidas", p.tipo === "prov" ? "Provisão" : "Versão 1", "", "", "", ""],
    now: { mode: p.estado === "provision" ? "wait" : "person", lead: p.estado === "provision" ? "Provisão feita · aguardando a sentença" : D.STATES[p.estado].label, why: p.motivo, cta: [p.estado === "needs_documents" ? "Enviar documento" : p.estado === "provision" ? "Ver a estimativa" : "Resolver", p.estado === "needs_documents" ? "documentos" : "calculo", ""] },
    leitura: { fase: p.fase, processual: "—", titulo: "—", desfecho: "—", pend: [] }, partes: [[p.autor, "Autor(a)", null], ...p.reus.split(/ e (?=[A-Z])/).map((r) => [r, r.match(/maroc|arajet|taag|ethiopian|finnair|westjet/i) && p.cliente ? "Ré · cliente" : "Ré", null])],
    resumo: "Conteúdo ilustrativo: este processo usa o modelo genérico do protótipo. Veja os processos 24, 29, 4 e 14 para os casos completos.", timeline: [], calc: null, folhas: {}, historico: [] };
}

/* ---------- jornada: mesmos 8 passos sempre, na ordem do guia; cada passo leva ao lugar dele ---------- */
const STEPS = [["Documentos", "documentos", ""], ["Leitura dos autos", "timeline", ""], ["Revisão da leitura", "timeline", "&visao=duvidas"], ["Memória de cálculo", "calculo", ""], ["Conferência", "calculo", "#aprovar"], ["Aprovação", "calculo", "#aprovar"], ["Guia", "calculo", "#guia"], ["Pago", "historico", ""]];
function journey() {
  return `<div class="steps" role="list" aria-label="Jornada do processo. Use as setas para ver os outros passos.">${STEPS.map(([n, t, h], i) => {
    const cls = i < C.current ? "done" : i === C.current ? "current" : C.provision && i >= 5 ? "locked" : "";
    const sub = C.steps[i] || (C.provision && i === 5 ? "Só com sentença" : i > C.current ? "próxima" : "");
    return `<a role="listitem" class="step ${cls}" tabindex="${i === C.current ? 0 : -1}" href="?id=${p.id}&aba=${t}${h}" ${i === C.current ? 'aria-current="step"' : ""}>
      <span class="dot">${i < C.current ? '<i data-lucide="check"></i>' : C.provision && i >= 5 ? '<i data-lucide="lock"></i>' : i + 1}</span>
      <span class="lbl">${n}</span><span class="sub">${sub}</span></a>`;
  }).join("")}</div>`;
}
function nowBlock() {
  let n = C.now; const who = D.TEAM[p.resp];
  if (C.calc?.checklist === "cliente_zero" && state.cliente && state.zero) n = { mode: "person", lead: state.zero === "zero" ? "Aprove e encerre sem valor" : "Aprove a memória", why: `Cliente indicada (${state.cliente}) e motivo do zero registrado. Falta só a aprovação de quem tem permissão.`, cta: [state.zero === "zero" ? "Aprovar e encerrar" : "Aprovar", "calculo", "#aprovar"] };
  else if (C.calc?.checklist === "cliente_zero" && (state.cliente || state.zero)) n = { ...n, lead: "Falta 1 pendência para aprovar", cta: ["Resolver a pendência", "calculo", "#aprovar"] };
  const mode = { person: ['user-round', 'Precisa de uma pessoa', 'person'], system: ['loader', 'O sistema está trabalhando', 'system'], wait: ['hourglass', 'Aguardando os autos', 'wait'] }[n.mode];
  return `<div class="now"><div>
      <span class="mode ${mode[2]}"><i data-lucide="${mode[0]}"></i>${mode[1]}</span>${UI.chg("proc-agora", "Mudou: um próximo passo só")}
      <div class="lead" style="margin-top:8px">${esc(n.lead)}</div>
      <p class="why">${esc(n.why).replace(/memória(?! de)/, UI.term("memória", "memoria")).replace(/estimativa/, UI.term("estimativa", "provisao"))}</p>
      <div class="row" style="flex-wrap:wrap;gap:8px"><a class="btn primary lg" href="?id=${p.id}&aba=${n.cta[1]}${n.cta[2]}" id="ctaMain"><i data-lucide="arrow-right"></i>${esc(n.cta[0])}</a></div></div>
    <div class="who"><span>Com quem está ${UI.chg("proc-comquem")}</span><span class="row" style="gap:8px">${person(p.resp)}<b>${who.nome}</b></span><span>${who.papel} · desde ${p.data.slice(0, 5)}</span>
      ${p.resp !== "sistema" ? `<button class="link" style="font-size:12px" onclick="UI.toast('Protótipo: escolher outra pessoa da equipe para este processo.')">Passar para outra pessoa</button>` : ""}</div></div>`;
}
function header() {
  const tot = C.calc?.memoria;
  return `<a class="link" href="processos.html" style="font-size:13px"><i data-lucide="chevron-left"></i>Processos</a>
  <div class="head" style="margin-top:10px"><div>
    <div class="row" style="flex-wrap:wrap;gap:10px"><h1 class="mono">${p.numero}</h1>
      <button class="icon-btn" aria-label="Copiar número do processo" onclick="navigator.clipboard?.writeText('${p.numero}');UI.toast('Número copiado')"><i data-lucide="copy"></i></button>
      ${badge(p.estado)}${UI.chg("estados")}</div>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:6px"><span>${esc(p.titulo)}</span><span class="subtle">· ${p.tribunal}</span><button class="icon-btn" aria-label="Editar título"><i data-lucide="pencil"></i></button></div>
    <div class="row" style="gap:8px;margin-top:8px">${clientTag({ cliente: state.cliente })}${valueTag(p)}${UI.chg("proc-cliente-topo")}</div></div>
    <div class="row" style="align-items:flex-start;gap:20px">
      ${tot ? `<dl class="totals"><div><dt>${C.provision ? UI.term("Provisão estimada", "provisao") : UI.term("Total devido", "total")}</dt><dd class="money big">${money(tot.total)}</dd></div><div><dt>${UI.term("Parte da cliente", "parte")}</dt><dd class="money big">${money(tot.parte)}</dd></div></dl>` : ""}
      ${UI.chg("proc-mais-acoes")}<div style="position:relative"><button class="btn" id="more" aria-haspopup="menu" aria-expanded="false"><i data-lucide="ellipsis"></i>Mais ações</button>
        <div class="menu" id="moreMenu" role="menu" hidden>
          <button role="menuitem" data-act="reler"><i data-lucide="refresh-cw"></i><span>Reler os autos<small>Lê todos os PDFs de novo. Tem custo e leva alguns minutos.</small></span></button>
          <button role="menuitem" data-act="arquivar"><i data-lucide="archive"></i><span>Arquivar processo<small>Sai das filas e do Painel. Dá para desfazer.</small></span></button>
        </div></div></div></div>
  <section class="card" style="margin-top:20px" aria-label="Jornada do processo"><div class="journey"><div style="margin:-6px 0 12px">${UI.chg("proc-jornada", "Mudou: jornada")}</div>${journey()}</div>${nowBlock()}</section>`;
}

/* ---------- abas ---------- */
const pendCount = C.calc?.checklist === "cliente_zero" ? 2 : C.calc?.checklist === "provisao" ? 1 : 0;
const TABS = [["visao", "Visão geral"], ["documentos", "Documentos", 1, p.estado === "needs_documents"], ["timeline", "Timeline"], ["calculo", "Cálculo", pendCount || null, pendCount > 0], ["historico", "Histórico"]];
function tabs() { return `<nav class="tabs" aria-label="Seções do processo">${TABS.map(([k, l, n, alert]) => `<a href="?id=${p.id}&aba=${k}" aria-selected="${aba === k}" ${aba === k ? 'aria-current="page"' : ""}>${l}${n ? `<span class="cnt ${alert ? "alert" : ""}">${n}</span>` : ""}</a>`).join("")}<span style="align-self:center">${UI.chg("proc-contadores")}</span></nav>`; }
const fl = (n, t = "fl. " + n) => `<button class="fl" data-fl="${n}"><i data-lucide="file-text"></i>${t}</button>`;

function visao() {
  const L = C.leitura;
  const reus = C.partes.filter(([, r]) => r.startsWith("Ré"));
  return `<div class="grid2" style="margin-top:20px">
    <section class="card"><div class="card-h"><h2>Leitura dos autos</h2></div><div class="card-b">
      <dl class="kv"><div><dt>Fase</dt><dd>${L.fase}</dd></div><div><dt>Fase processual</dt><dd>${L.processual}</dd></div><div><dt>Título vigente</dt><dd>${L.titulo}</dd></div><div><dt>Desfecho</dt><dd>${L.desfecho}</dd></div></dl>
      ${L.pend.length ? `<div class="sep"></div><h3>Pendências</h3><ul style="margin:6px 0 0;padding-left:18px">${L.pend.map((x) => `<li>${esc(x)} <a class="link" href="?id=${p.id}&aba=${C.calc ? "calculo#aprovar" : "documentos#faltam"}" style="font-size:12px">Resolver</a></li>`).join("")}</ul>` : ""}
    </div></section>
    <section class="card" id="partes"><div class="card-h"><div><h2>Partes ${UI.chg("visao-partes")}</h2><p>A cliente define quem paga a conta. Ela pode ser indicada aqui.</p></div></div><div class="card-b">
      ${C.partes.map(([n, r, adv]) => { const isRe = r.startsWith("Ré"); const isCli = (state.cliente && n.toLowerCase().includes(state.cliente.split(" ").pop().toLowerCase())) || r.includes("cliente");
        return `<div class="row" style="padding:10px 0;border-top:1px solid var(--border);align-items:flex-start"><div style="flex:1"><b>${esc(n)}</b> <span class="tag">${isRe ? "Ré" : r}</span> ${isRe && isCli ? '<span class="tag client"><i data-lucide="briefcase"></i>Cliente</span>' : ""}
          <div class="help">${adv ? "Advogados: " + esc(adv) : isRe ? "Advogados não identificados nos autos" : ""}</div></div>
          ${isRe && !state.cliente ? `<button class="btn" data-mark="${esc(n)}"><i data-lucide="briefcase"></i>Marcar como cliente</button>` : ""}</div>`; }).join("")}
      <div class="sep" style="margin:8px 0 12px"></div><div class="row"><span class="help" style="flex:1">Responsabilidade da cliente: <b style="color:var(--fg)">direta, integral</b> · padrão do perfil, porque os autos não dizem.</span><button class="btn ghost">Alterar</button></div>
    </div></section></div>
    <section class="card" style="margin-top:16px"><div class="card-h"><h2>O processo</h2></div><div class="card-b"><p style="margin:0">${esc(C.resumo)}</p></div></section>
    ${C.timeline.length ? `<section class="card" style="margin-top:16px"><div class="card-h"><h2>Decisões, prazos e providências ${UI.chg("folha-lado", "Mudou: folha ao lado")}</h2></div><div class="card-b">${C.timeline.slice().reverse().filter((t) => t[5]).map((t) => `<div class="row" style="align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)"><span class="mono subtle" style="width:92px;font-size:12px">${t[0]}</span><div style="flex:1"><b>${t[2]}</b><div class="help">${t[3]}</div></div>${fl(t[4])}</div>`).join("")}</div></section>` : ""}`;
}

function documentos() {
  const falta = p.estado === "needs_documents";
  return `${falta ? `<section class="card" id="faltam" style="margin-top:20px"><div class="card-h"><div><h2>O que falta para a leitura continuar ${UI.chg("docs-falta", "Novo")}</h2><p>O sistema compara o que a sentença pede com o que já está nos autos.</p></div></div><div class="card-b">
      <div class="check"><span class="ic bad"><i data-lucide="x"></i></span><div><h3>Planilha da liquidação homologada</h3><p>A sentença manda apurar o valor em liquidação ${fl(211)}. Ela costuma estar nos autos depois da sentença, com o nome "cálculos" ou "planilha de liquidação".</p></div></div>
      <div class="check"><span class="ic ok"><i data-lucide="check"></i></span><div><h3>Petição inicial</h3><p>fls. 1–39</p></div></div>
      <div class="check"><span class="ic ok"><i data-lucide="check"></i></span><div><h3>Sentença e embargos</h3><p>fls. 211–245</p></div></div></div></section>` : ""}
    <section class="card" style="margin-top:16px"><div class="card-b"><div class="drop"><i data-lucide="upload-cloud" style="width:28px;height:28px;color:var(--brand-400)"></i><h3 style="margin-top:8px">Arraste os PDFs aqui</h3><p class="muted" style="margin:4px 0 12px">Eles entram direto neste processo. A leitura começa sozinha.</p>
      <div class="row" style="justify-content:center;flex-wrap:wrap"><label class="field" style="flex-direction:row;align-items:center">Tipo<select class="select"><option>${falta ? "Peça avulsa: planilha de liquidação" : "Processo completo"}</option><option>Peça avulsa</option><option>Planilha de contingência da cliente</option></select></label><button class="btn primary" onclick="UI.toast('Protótipo: abriria a escolha de arquivos. Só PDF.')">Escolher arquivos</button></div></div></div></section>
    <section class="card" style="margin-top:16px"><div class="card-h"><h2>Documentos do processo ${UI.chg("docs-linguagem")}</h2></div><div class="card-b">
      <div class="row" style="padding:8px 0"><i data-lucide="file-text"></i><div style="flex:1"><b>Autos completos · parte 1</b><div class="help">98 páginas · 13,3 MB · enviado por Bruna Martins em 29/10 · lido</div></div><button class="btn ghost"><i data-lucide="eye"></i>Ver</button><button class="btn ghost"><i data-lucide="download"></i>Baixar</button><button class="btn ghost danger" onclick="UI.confirmDialog({title:'Excluir este documento?',body:'<p>O documento sai do processo e a leitura dos autos é refeita sem ele. A memória atual vira uma versão antiga.</p>',ok:'Excluir documento',danger:true,onOk:()=>UI.toast(\'Protótipo: documento excluído.\')})"><i data-lucide="trash-2"></i>Excluir</button></div></div></section>`;
}

let tlView = P.get("visao") || "resumida";
function timeline() {
  const views = [["resumida", "Resumida"], ["completa", "Completa"], ["duvidas", "Dúvidas da leitura"], ["mudou", "O que mudou"]];
  let body;
  if (tlView === "duvidas") body = `<div class="callout" style="--c:var(--positive)"><i data-lucide="circle-check"></i><div><b>Nenhuma dúvida da leitura</b><p>O sistema teve certeza de todos os atos que leu. Os pontos da conta ficam na aba <a class="link" href="?id=${p.id}&aba=calculo#aprovar">Cálculo</a>.</p></div></div>`;
  else if (tlView === "mudou") body = `<p class="muted">Nada mudou desde a última leitura (09/11/2026 15:35).</p>`;
  else body = (C.timeline.length ? C.timeline : [["—", "—", "Este processo usa o modelo genérico do protótipo.", "", 1, null]]).map((t) => `<div class="row" style="align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)"><span class="mono subtle" style="width:92px;font-size:12px">${t[0]}</span><div style="flex:1"><span class="tag">${t[1]}</span> <b>${t[2]}</b>${tlView === "completa" || t[3] ? `<div class="help" style="margin-top:2px">${t[3]}</div>` : ""}</div>${fl(t[4])}</div>`).join("");
  return `<div class="row" style="margin-top:16px;flex-wrap:wrap"><div class="subtabs" role="tablist">${views.map(([k, l]) => `<a class="chip ${tlView === k ? "on" : ""}" href="?id=${p.id}&aba=timeline&visao=${k}">${l}</a>`).join("")}</div>${UI.chg("tl-duvidas", "Mudou: Dúvidas da leitura")}${UI.chg("tl-folha", "Mudou: folha em cada ato")}<span style="flex:1"></span><span class="help">Lida em 09/11/2026, 15:35 · cada ato mostra a folha de onde veio</span></div>
    <section class="card"><div class="card-b" style="padding-top:4px">${body}</div></section>`;
}

/* ---------- Cálculo: começa pelo que falta para aprovar ---------- */
function checklist() {
  const k = C.calc.checklist;
  if (k === "provisao") return `<section class="card" id="aprovar" style="margin-top:20px"><div class="card-h"><div><h2>Para conferir nesta estimativa ${UI.chg("calc-para-aprovar", "Mudou: começa pelo que falta")}</h2><p>A provisão não é aprovada. Quando a sentença chegar, a memória é refeita e vem para aprovação.</p></div></div><div class="card-b">
    <div class="check"><span class="ic bad"><i data-lucide="calendar-x"></i></span><div style="flex:1"><h3>Data da citação não encontrada</h3><p>Os juros estão contando do ajuizamento (26/08/2026) ${fl(2)}. Se você souber a data da citação, informe aqui e diga de onde ela veio.</p>
      <div class="row" style="flex-wrap:wrap;align-items:flex-end"><label class="field">Data da citação<input class="input" type="date" id="cit"></label><label class="field">De onde veio<input class="input" placeholder="Ex.: AR juntado, fl. 31" id="citFonte"></label><button class="btn primary" id="citOk">Usar esta data</button></div>
      <p class="help" style="margin-top:8px">Gera uma nova versão da provisão. Nada é alterado antes de você confirmar.</p></div></div></div></section>`;
  if (k === "ok") return `<section class="card" id="aprovar" style="margin-top:20px"><div class="card-h"><div><h2>Pronto para aprovar ${UI.chg("calc-para-aprovar", "Mudou: começa pelo que falta")}</h2><p>Tudo o que a conta precisa está conferido.</p></div></div><div class="card-b">
    <div class="check"><span class="ic ok"><i data-lucide="check"></i></span><div><h3>Cliente: Finnair</h3><p>Responsabilidade direta e integral.</p></div></div>
    <div class="check"><span class="ic ok"><i data-lucide="check"></i></span><div><h3>Valores informados por Rafael Moura</h3><p>Custas: R$ 0,00 (isenção), em 06/11.</p></div></div>
    <div class="check"><span class="ic ok"><i data-lucide="check"></i></span><div><h3>Data de referência: hoje (16/11/2026)</h3><p>O valor está atualizado até a data em que será pago.</p></div></div>
    ${approveBar(true)}</div></section>`;
  const reus = C.partes.filter(([, r]) => r.startsWith("Ré"));
  const cOk = !!state.cliente, zOk = !!state.zero;
  return `<section class="card" id="aprovar" style="margin-top:20px"><div class="card-h"><div><h2>Para aprovar esta memória ${UI.chg("calc-para-aprovar", "Mudou: começa pelo que falta")}</h2><p>${[!cOk, !zOk].filter(Boolean).length ? `Faltam ${[!cOk, !zOk].filter(Boolean).length} itens. Cada um mostra o motivo e onde resolver.` : "Tudo resolvido."}</p></div></div><div class="card-b">
    <div class="check"><span class="ic ${cOk ? "ok" : "bad"}"><i data-lucide="${cOk ? "check" : "briefcase"}"></i></span><div style="flex:1">
      <h3>${cOk ? "Cliente: " + esc(state.cliente) : "Indique qual ré é a cliente"} ${UI.chg("calc-cliente", "Novo")}</h3>
      ${cOk ? `<p>Indicada por você agora. <button class="link" data-undo-cliente>Desfazer</button></p>` : `<p>Os autos não dizem qual das rés a equipe defende. A conta só considera a parte da cliente.</p>
        ${reus.map(([n], i) => `<label class="choice"><input type="radio" name="cli" value="${esc(n)}" ${i === reus.length - 1 ? "checked" : ""}><span style="flex:1">${esc(n)}</span>${/maroc/i.test(n) ? '<span class="help">Sugestão: é cliente em 8 outros processos</span>' : ""}</label>`).join("")}
        <label class="choice"><input type="radio" name="cli" value=""><span>Nenhuma das rés é cliente: tirar este processo da carteira</span></label>
        <button class="btn primary" style="margin-top:10px" id="cliOk">Confirmar cliente</button>`}</div></div>
    <div class="check"><span class="ic ${zOk ? "ok" : "bad"}"><i data-lucide="${zOk ? "check" : "circle-dollar-sign"}"></i></span><div style="flex:1">
      <h3>${zOk ? (state.zero === "zero" ? "Decisão: a cliente não deve nada" : "Valor informado") : "A conta deu zero: confirme o motivo"} ${UI.chg("calc-zero")}</h3>
      ${zOk ? `<p>${state.zero === "zero" ? "O processo será encerrado sem valor depois da aprovação." : ""} <button class="link" data-undo-zero>Desfazer</button></p>` : `<p>A sentença homologou um acordo entre o autor e a TAP ${fl(87)}, e o alvará de R$ 4.112,71 foi pago em 21/08 ${fl(102)}. A Royal Air Maroc não aparece no acordo ${fl(61)}.</p>
        <label class="choice"><input type="radio" name="zero" value="zero" checked><span>A cliente não deve nada: encerrar sem valor</span></label>
        <label class="choice"><input type="radio" name="zero" value="valor"><span>A cliente deve um valor que não está nos autos</span></label>
        <div class="row" id="zeroValor" hidden style="margin-top:8px;flex-wrap:wrap;align-items:flex-end"><label class="field">Valor<input class="input" placeholder="R$ 0,00"></label><label class="field">De onde veio<input class="input" placeholder="Ex.: planilha da cliente, fl. 110"></label></div>
        <button class="btn primary" style="margin-top:10px" id="zeroOk">Registrar decisão</button>`}</div></div>
    <div class="check"><span class="ic info"><i data-lucide="calendar"></i></span><div style="flex:1"><h3>${UI.term("Data de referência", "dataref")}: 10/11/2026</h3><p>Essa data já passou: o valor está atualizado só até ela. <button class="link" onclick="UI.toast('Protótipo: nova versão com data de referência 16/11/2026.')">Atualizar para hoje</button></p></div></div>
    ${approveBar(cOk && zOk)}</div></section>`;
}
function approveBar(ok) {
  const zero = state.zero === "zero";
  return `<div class="row" style="justify-content:flex-end;gap:12px;padding-top:14px;border-top:1px solid var(--border);margin-top:4px;flex-wrap:wrap">
    ${UI.chg("calc-aprovar")}<span class="help">${ok ? "Ao aprovar, a memória congela. Para mudar depois, é preciso remover a aprovação, com um motivo." : "O botão libera quando os itens acima estiverem resolvidos."}</span>
    <button class="btn primary lg" id="approve" ${ok ? "" : "disabled"}><i data-lucide="badge-check"></i>${zero ? "Aprovar e encerrar sem valor" : `Aprovar versão ${C.calc.memoria.versao}`}</button></div>`;
}
function verbaHtml(v) {
  const mm = (t, cols) => t ? `<details style="margin-top:8px"><summary class="link" style="cursor:pointer;font-size:12px">Mês a mês</summary><table class="mm"><thead><tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${t.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></details>` : "";
  return `<details class="verba"><summary><i data-lucide="chevron-right" class="chev"></i><b>${v.nome}</b>
    <span class="num hide-sm"><span class="lbl-s">Valor de partida</span>${money(v.partida)}</span><span class="num hide-sm"><span class="lbl-s">Corrigido</span>${money(v.corrigido)}</span><span class="num hide-sm"><span class="lbl-s">Juros</span>${money(v.juros)}</span><span class="num"><span class="lbl-s">Total</span><b class="money">${money(v.total)}</b></span></summary>
    <div class="in"><h3 style="margin-top:14px">De onde veio o valor</h3><div class="row" style="margin-top:6px"><span class="muted">${v.origem[0]}</span>${fl(v.origem[1].split("-")[0], "fls. " + v.origem[1])}</div><div class="quote">${esc(v.origem[2])}</div>
    ${v.correcao ? `<div class="grid2" style="margin-top:12px"><div><h3>Correção monetária</h3><p class="muted" style="margin:4px 0">${v.correcao[0]} · ${v.correcao[1]}</p><p class="help" style="margin:0">Começa no ${v.correcao[2]} ${fl(2)} · termina na data de referência</p>${mm(v.correcao[3], ["Mês", "Dias", "Índice", "Correção", "Base corrigida"])}</div>
      <div><h3>Juros</h3><p class="muted" style="margin:4px 0">${v.juros[0]} · ${v.juros[1]}</p><p class="help" style="margin:0">Começa no ${v.juros[2]} ${fl(2)} · termina na data de referência</p>${mm(v.juros[3], ["Mês", "Dias", "Taxa", "Juros"])}</div></div>` : ""}</div></details>`;
}
function calculo() {
  if (!C.calc) return `<section class="card" style="margin-top:20px"><div class="card-b"><div class="callout" style="--c:var(--state-needs_documents)"><i data-lucide="file-warning"></i><div><b>A conta ainda não pode ser montada</b><p>${esc(p.motivo)} Assim que o documento chegar, a leitura continua e a memória aparece aqui.</p><a class="btn" style="margin-top:10px" href="?id=${p.id}&aba=documentos#faltam"><i data-lucide="upload"></i>Ver o que falta</a></div></div></div></section>`;
  const m = C.calc.memoria;
  return `${C.provision ? `<div class="callout" style="margin-top:20px;--c:var(--state-calculated)"><i data-lucide="info"></i><div><b>Provisão: estimativa sem sentença</b> ${UI.chg("calc-provisao")}<p>Feita a partir dos pedidos da petição inicial. Serve para provisionar e não é o valor de uma condenação: não é aprovada e não gera guia.</p></div></div>` : ""}
    ${checklist()}
    <section class="card" style="margin-top:16px"><div class="card-h" style="flex-wrap:wrap"><h2>${UI.term(C.provision ? "Memória de provisão" : "Memória de cálculo", C.provision ? "provisao" : "memoria")} · Versão ${m.versao}</h2>${UI.chg("glossario", "Novo: termos explicados")}<span class="badge plain" style="--c:var(--state-calculated)">${m.rotulo}</span><span style="flex:1"></span>
      <button class="btn" id="calcChat"><i data-lucide="message-square-diff"></i>Chat do cálculo</button>${UI.chg("chat-calculo")}</div>
      <div class="card-b"><dl class="kv"><div><dt>${C.provision ? "Estimativa total" : "Total devido"}</dt><dd class="money big">${money(m.total)}</dd></div><div><dt>${UI.term("Parte da cliente", "parte")}</dt><dd class="money big">${money(m.parte)}</dd></div><div><dt>${UI.term("Data de referência", "dataref")}</dt><dd>${m.ref} <button class="link" style="font-size:12px" onclick="UI.toast('Protótipo: escolher nova data; gera uma versão nova.')">Alterar</button></dd></div><div><dt>Responsabilidade</dt><dd>Direta</dd></div></dl>
      <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn"><i data-lucide="sheet"></i>Baixar planilha</button><button class="btn"><i data-lucide="file-down"></i>Baixar PDF</button><span style="flex:1"></span><button class="btn ghost"><i data-lucide="history"></i>Versões (${m.versao})</button><button class="btn ghost"><i data-lucide="git-compare"></i>Comparar versões</button></div></div></section>
    <section style="margin-top:20px"><div class="row" style="margin-bottom:10px"><h2>${UI.term("Verbas", "verba")} ${UI.chg("calc-verbas")}</h2><span class="help">${C.calc.verbas.length} ${C.calc.verbas.length === 1 ? "verba" : "verbas"} · clique para ver a origem e a conta mês a mês</span></div>
      ${C.calc.verbas.length ? C.calc.verbas.map(verbaHtml).join("") : `<div class="card card-b muted">Nenhuma verba com valor: a sentença não condena a cliente.</div>`}
      <div class="card" style="margin-top:12px;padding:14px 16px;box-shadow:none"><div class="row"><b style="flex:1">${C.provision ? "Estimativa total (não gera guia)" : "Total devido · base para a guia"}</b><span class="money big">${money(m.total)}</span></div></div></section>
    <details class="card" style="margin-top:16px"><summary class="card-b" style="cursor:pointer"><b>Evolução por fase</b> <span class="help">· quanto o valor mudou da inicial até o título vigente</span></summary><div class="card-b" style="padding-top:0"><div class="phase">${C.calc.fases.map(([f, d, v, n]) => `<div class="card"><span class="help">${f} · ${d}</span><div class="money" style="font-size:18px;margin-top:4px">${money(v)}</div><div class="help">${n}</div></div>`).join("")}</div></div></details>
    ${!C.provision ? `<section class="card" id="guia" style="margin-top:16px"><div class="card-b row"><i data-lucide="receipt"></i><div style="flex:1"><b>${UI.term("Guia de pagamento", "guia")}</b><div class="help">Liberada depois da aprovação. A guia é emitida no tribunal; o comprovante aparece aqui quando o pagamento for identificado.</div></div><button class="btn" disabled>Pedir guia</button></div></section>` : ""}`;
}
function historico() {
  const h = C.historico.length ? C.historico : [[p.data, "Última mudança registrada", D.TEAM[p.resp].nome]];
  return `<section class="card" style="margin-top:20px"><div class="card-h"><h2>O que aconteceu com o processo ${UI.chg("hist-nomes")}</h2></div><div class="card-b">${h.slice().reverse().map(([d, t, w]) => `<div class="row" style="align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)"><span class="mono subtle" style="width:130px;font-size:12px">${d}</span><span style="flex:1">${t}</span><span class="help">${w}</span></div>`).join("")}
    <details style="margin-top:12px"><summary class="help" style="cursor:pointer">Detalhes técnicos para o suporte</summary><p class="help">Tarefas internas da leitura e do cálculo, com tentativas e horários. Ficam fora da vista do dia a dia.</p></details></div></section>`;
}

/* ---------- painéis laterais ---------- */
function openFolha(n) {
  const f = C.folhas[n] || ["Autos", "Trecho ilustrativo da folha."];
  openSide(`<div class="side-h"><i data-lucide="file-text"></i><h2 style="flex:1">Autos · fl. ${n}</h2><button class="icon-btn" data-close aria-label="Fechar"><i data-lucide="x"></i></button></div>
    <div class="side-b"><p class="help" style="margin-top:0">${f[0]} · o trecho usado está marcado</p><div class="page"><div class="pg">fl. ${n}</div>${f[1]}</div></div>
    <div class="side-f row"><button class="btn" onclick="UI.toast('Protótipo: abre o PDF já nesta folha.')"><i data-lucide="external-link"></i>Abrir o PDF nesta folha</button><button class="btn ghost"><i data-lucide="download"></i>Baixar</button></div>`);
}
function openAsk() {
  openSide(`<div class="side-h"><i data-lucide="message-circle-question"></i><h2 style="flex:1">Perguntar sobre o processo</h2><button class="icon-btn" data-close aria-label="Fechar"><i data-lucide="x"></i></button></div>
    <div class="side-b"><div class="privacy"><i data-lucide="lock"></i><span><b>Só você vê esta conversa.</b> Aqui você só pergunta: nada do processo muda.</span></div>
      <div class="msg me">Por que a conta deu zero?</div>
      <div class="msg">A sentença de 17/07/2026 homologou um acordo entre o autor e a TAP ${fl(87)}. A TAP pagou R$ 4.112,71 por alvará em 21/08 ${fl(102)}. A Royal Air Maroc não participou do acordo e não foi condenada.</div>
      <p class="help">Exemplos: Quais pedidos a sentença deferiu? · Há recurso pendente? · Qual é o total e em que data?</p></div>
    <div class="side-f"><input class="input" style="width:100%" placeholder="Pergunte sobre o processo" aria-label="Pergunta"><p class="help" style="margin:6px 0 0">Para mudar a conta, use o Chat do cálculo, na aba Cálculo.</p></div>`);
}
function openCalcChat() {
  openSide(`<div class="side-h"><i data-lucide="message-square-diff"></i><h2 style="flex:1">Chat do cálculo</h2><button class="icon-btn" data-close aria-label="Fechar"><i data-lucide="x"></i></button></div>
    <div class="side-b"><div class="privacy" style="background:color-mix(in oklch,var(--state-needs_review) 12%,transparent);color:var(--fg)"><i data-lucide="users"></i><span><b>Visível para toda a equipe.</b> Este chat altera a conta. Nada vale antes de você confirmar, e cada confirmação gera uma versão nova.</span></div>
      <div class="msg me">A citação foi em 15/09/2026, pelo AR da fl. 31.</div>
      <div class="msg">Mudança proposta para a verba Danos morais:<table class="diff"><thead><tr><th></th><th>Era</th><th>Ficou</th></tr></thead><tbody><tr><td>Juros desde</td><td>26/08/2026</td><td><b>15/09/2026</b></td></tr><tr><td>Juros</td><td>R$ 237,33</td><td><b>R$ 168,90</b></td></tr><tr><td>Total</td><td>R$ 10.423,39</td><td><b>R$ 10.354,96</b></td></tr></tbody></table>
        <div class="row" style="margin-top:10px"><button class="btn primary" onclick="UI.confirmDialog({title:'Confirmar a mudança?',body:'<p>Gera a versão 2 da memória com juros a partir de 15/09/2026. A versão 1 continua disponível para comparar.</p>',ok:'Confirmar e gerar versão 2',onOk:()=>UI.toast('Protótipo: versão 2 gerada.')})">Confirmar</button><button class="btn">Descartar</button></div></div></div>
    <div class="side-f"><input class="input" style="width:100%" placeholder="Pergunte ou peça uma mudança na conta" aria-label="Mensagem"></div>`);
}

/* ---------- montagem ---------- */
// R8: depois de resolver um item, o foco segue para o próximo pendente (e a mudança é anunciada)
function nextFocus() {
  const el = document.querySelector('input[name=cli]:checked') || document.querySelector('input[name=zero]:checked') || document.querySelector('#approve:not([disabled])') || document.querySelector('#aprovar h2');
  if (el) { if (el.tagName === "H2") el.tabIndex = -1; el.focus({ preventScroll: true }); el.scrollIntoView({ block: "center" }); }
}
function render() {
  const body = { visao, documentos, timeline, calculo, historico }[aba] || visao;
  $("#root").innerHTML = header() + tabs() + body() +
    `<button class="ask-fab" id="ask"><i data-lucide="message-circle-question"></i>Perguntar sobre o processo</button><span class="chg-fab" style="position:fixed;right:24px;bottom:66px;z-index:21">${UI.chg("chat-perguntar", "Mudou: chat privado ao lado")}</span>
     <div class="mobile-bar">${UI.chg("mobile-barra", "Mudou")}<a class="btn primary" href="?id=${p.id}&aba=${C.now.cta[1]}${C.now.cta[2]}">${esc(C.now.cta[0])}</a><button class="btn icon" id="askM" aria-label="Perguntar sobre o processo"><i data-lucide="message-circle-question"></i></button></div>`;
  icons(); bind();
  $("#askM").onclick = openAsk;
  // R3: a jornada é uma parada só no Tab; as setas andam entre os passos
  const steps = $$(".step");
  steps.forEach((s, i) => s.addEventListener("keydown", (e) => {
    const k = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!k) return;
    e.preventDefault(); const n = steps[(i + k + steps.length) % steps.length]; steps.forEach((x) => (x.tabIndex = -1)); n.tabIndex = 0; n.focus(); }));
  const cur = $(".step.current"); if (cur && innerWidth < 820) cur.parentElement.scrollLeft = cur.offsetLeft - 40;
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView({ block: "start" });
}
function bind() {
  $$("[data-fl]").forEach((b) => (b.onclick = () => openFolha(b.dataset.fl)));
  $("#ask").onclick = openAsk;
  $("#calcChat") && ($("#calcChat").onclick = openCalcChat);
  const more = $("#more"), menu = $("#moreMenu");
  more.onclick = () => { menu.hidden = !menu.hidden; more.setAttribute("aria-expanded", !menu.hidden); };
  $$("[data-act]", menu).forEach((b) => (b.onclick = () => { menu.hidden = true;
    if (b.dataset.act === "reler") confirmDialog({ title: "Reler os autos?", body: "<p>O sistema lê todos os PDFs de novo. Isso tem custo e leva alguns minutos; a memória atual vira uma versão antiga.</p>", ok: "Reler os autos", onOk: () => toast("Protótipo: leitura pedida.") });
    else confirmDialog({ title: "Arquivar este processo?", body: "<p>Ele sai das filas e do Painel, mas continua na lista com o filtro Arquivado. Dá para desfazer.</p>", ok: "Arquivar", onOk: () => toast("Protótipo: processo arquivado.") }); }));
  $$("[data-mark]").forEach((b) => (b.onclick = () => { state.cliente = /maroc/i.test(b.dataset.mark) ? "Royal Air Maroc" : b.dataset.mark; toast(`${b.dataset.mark} marcada como cliente.`); render(); }));
  $("#cliOk") && ($("#cliOk").onclick = () => { const v = $("input[name=cli]:checked").value; state.cliente = v ? (/maroc/i.test(v) ? "Royal Air Maroc" : v) : "—"; render(); nextFocus(); toast(`Cliente indicada: ${state.cliente}.`); });
  $("[data-undo-cliente]") && ($("[data-undo-cliente]").onclick = () => { state.cliente = null; render(); nextFocus(); });
  $$("input[name=zero]").forEach((r) => (r.onchange = () => ($("#zeroValor").hidden = r.value !== "valor" || !r.checked)));
  $("#zeroOk") && ($("#zeroOk").onclick = () => { state.zero = $("input[name=zero]:checked").value; render(); nextFocus(); toast(state.zero === "zero" ? "Decisão registrada: a cliente não deve nada." : "Valor registrado."); });
  $("[data-undo-zero]") && ($("[data-undo-zero]").onclick = () => { state.zero = null; render(); nextFocus(); });
  $("#citOk") && ($("#citOk").onclick = () => { if (!$("#cit").value) { toast("Informe a data da citação."); $("#cit").focus(); return; } openCalcChat(); });
  $("#approve") && ($("#approve").onclick = () => confirmDialog({ title: state.zero === "zero" ? "Aprovar e encerrar sem valor?" : `Aprovar a versão ${C.calc.memoria.versao}?`, body: `<p>${state.zero === "zero" ? "A memória com valor zero fica congelada e o processo vai para Encerrado, sem guia." : `A memória de ${money(C.calc.memoria.total)} fica congelada e a guia pode ser pedida.`} Para mudar depois, é preciso remover a aprovação, com um motivo.</p>`, ok: "Aprovar", onOk: () => toast("Protótipo: memória aprovada.") }));
}
render();
</script>
</body>
</html>
