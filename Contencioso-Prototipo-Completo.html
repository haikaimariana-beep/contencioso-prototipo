\"card-b\">\n    <div class=\"check\"><span class=\"ic ok\"><i data-lucide=\"check\"><\/i><\/span><div><h3>Cliente: Finnair<\/h3><p>Responsabilidade direta e integral.<\/p><\/div><\/div>\n    <div class=\"check\"><span class=\"ic ok\"><i data-lucide=\"check\"><\/i><\/span><div><h3>Valores informados por Rafael Moura<\/h3><p>Custas: R$ 0,00 (isenção), em 06/11.<\/p><\/div><\/div>\n    <div class=\"check\"><span class=\"ic ok\"><i data-lucide=\"check\"><\/i><\/span><div><h3>Data de referência: hoje (16/11/2026)<\/h3><p>O valor está atualizado até a data em que será pago.<\/p><\/div><\/div>\n    ${approveBar(true)}<\/div><\/section>`;\n  const reus = C.partes.filter(([, r]) => r.startsWith(\"Ré\"));\n  const cOk = !!state.cliente, zOk = !!state.zero;\n  return `<section class=\"card\" id=\"aprovar\" style=\"margin-top:20px\"><div class=\"card-h\"><div><h2>Para aprovar esta memória ${UI.chg(\"calc-para-aprovar\", \"Mudou: começa pelo que falta\")}<\/h2><p>${[!cOk, !zOk].filter(Boolean).length ? `Faltam ${[!cOk, !zOk].filter(Boolean).length} itens. Cada um mostra o motivo e onde resolver.` : \"Tudo resolvido.\"}<\/p><\/div><\/div><div class=\"card-b\">\n    <div class=\"check\"><span class=\"ic ${cOk ? \"ok\" : \"bad\"}\"><i data-lucide=\"${cOk ? \"check\" : \"briefcase\"}\"><\/i><\/span><div style=\"flex:1\">\n      <h3>${cOk ? \"Cliente: \" + esc(state.cliente) : \"Indique qual ré é a cliente\"} ${UI.chg(\"calc-cliente\", \"Novo\")}<\/h3>\n      ${cOk ? `<p>Indicada por você agora. <button class=\"link\" data-undo-cliente>Desfazer<\/button><\/p>` : `<p>Os autos não dizem qual das rés a equipe defende. A conta só considera a parte da cliente.<\/p>\n        ${reus.map(([n], i) => `<label class=\"choice\"><input type=\"radio\" name=\"cli\" value=\"${esc(n)}\" ${i === reus.length - 1 ? \"checked\" : \"\"}><span style=\"flex:1\">${esc(n)}<\/span>${/maroc/i.test(n) ? '<span class=\"help\">Sugestão: é cliente em 8 outros processos<\/span>' : \"\"}<\/label>`).join(\"\")}\n        <label class=\"choice\"><input type=\"radio\" name=\"cli\" value=\"\"><span>Nenhuma das rés é cliente: tirar este processo da carteira<\/span><\/label>\n        <button class=\"btn primary\" style=\"margin-top:10px\" id=\"cliOk\">Confirmar cliente<\/button>`}<\/div><\/div>\n    <div class=\"check\"><span class=\"ic ${zOk ? \"ok\" : \"bad\"}\"><i data-lucide=\"${zOk ? \"check\" : \"circle-dollar-sign\"}\"><\/i><\/span><div style=\"flex:1\">\n      <h3>${zOk ? (state.zero === \"zero\" ? \"Decisão: a cliente não deve nada\" : \"Valor informado\") : \"A conta deu zero: confirme o motivo\"} ${UI.chg(\"calc-zero\")}<\/h3>\n      ${zOk ? `<p>${state.zero === \"zero\" ? \"O processo será encerrado sem valor depois da aprovação.\" : \"\"} <button class=\"link\" data-undo-zero>Desfazer<\/button><\/p>` : `<p>A sentença homologou um acordo entre o autor e a TAP ${fl(87)}, e o alvará de R$ 4.112,71 foi pago em 21/08 ${fl(102)}. A Royal Air Maroc não aparece no acordo ${fl(61)}.<\/p>\n        <label class=\"choice\"><input type=\"radio\" name=\"zero\" value=\"zero\" checked><span>A cliente não deve nada: encerrar sem valor<\/span><\/label>\n        <label class=\"choice\"><input type=\"radio\" name=\"zero\" value=\"valor\"><span>A cliente deve um valor que não está nos autos<\/span><\/label>\n        <div class=\"row\" id=\"zeroValor\" hidden style=\"margin-top:8px;flex-wrap:wrap;align-items:flex-end\"><label class=\"field\">Valor<input class=\"input\" placeholder=\"R$ 0,00\"><\/label><label class=\"field\">De onde veio<input class=\"input\" placeholder=\"Ex.: planilha da cliente, fl. 110\"><\/label><\/div>\n        <button class=\"btn primary\" style=\"margin-top:10px\" id=\"zeroOk\">Registrar decisão<\/button>`}<\/div><\/div>\n    <div class=\"check\"><span class=\"ic info\"><i data-lucide=\"calendar\"><\/i><\/span><div style=\"flex:1\"><h3>${UI.term(\"Data de referência\", \"dataref\")}: 10/11/2026<\/h3><p>Essa data já passou: o valor está atualizado só até ela. <button class=\"link\" onclick=\"UI.toast('Protótipo: nova versão com data de referência 16/11/2026.')\">Atualizar para hoje<\/button><\/p><\/div><\/div>\n    ${approveBar(cOk && zOk)}<\/div><\/section>`;\n}\nfunction approveBar(ok) {\n  const zero = state.zero === \"zero\";\n  return `<div class=\"row\" style=\"justify-content:flex-end;gap:12px;padding-top:14px;border-top:1px solid var(--border);margin-top:4px;flex-wrap:wrap\">\n    ${UI.chg(\"calc-aprovar\")}<span class=\"help\">${ok ? \"Ao aprovar, a memória congela. Para mudar depois, é preciso remover a aprovação, com um motivo.\" : \"O botão libera quando os itens acima estiverem resolvidos.\"}<\/span>\n    <button class=\"btn primary lg\" id=\"approve\" ${ok ? \"\" : \"disabled\"}><i data-lucide=\"badge-check\"><\/i>${zero ? \"Aprovar e encerrar sem valor\" : `Aprovar versão ${C.calc.memoria.versao}`}<\/button><\/div>`;\n}\nfunction verbaHtml(v) {\n  const mm = (t, cols) => t ? `<details style=\"margin-top:8px\"><summary class=\"link\" style=\"cursor:pointer;font-size:12px\">Mês a mês<\/summary><table class=\"mm\"><thead><tr>${cols.map((c) => `<th>${c}<\/th>`).join(\"\")}<\/tr><\/thead><tbody>${t.map((r) => `<tr>${r.map((c) => `<td>${c}<\/td>`).join(\"\")}<\/tr>`).join(\"\")}<\/tbody><\/table><\/details>` : \"\";\n  return `<details class=\"verba\"><summary><i data-lucide=\"chevron-right\" class=\"chev\"><\/i><b>${v.nome}<\/b>\n    <span class=\"num hide-sm\"><span class=\"lbl-s\">Valor de partida<\/span>${money(v.partida)}<\/span><span class=\"num hide-sm\"><span class=\"lbl-s\">Corrigido<\/span>${money(v.corrigido)}<\/span><span class=\"num hide-sm\"><span class=\"lbl-s\">Juros<\/span>${money(v.juros)}<\/span><span class=\"num\"><span class=\"lbl-s\">Total<\/span><b class=\"money\">${money(v.total)}<\/b><\/span><\/summary>\n    <div class=\"in\"><h3 style=\"margin-top:14px\">De onde veio o valor<\/h3><div class=\"row\" style=\"margin-top:6px\"><span class=\"muted\">${v.origem[0]}<\/span>${fl(v.origem[1].split(\"-\")[0], \"fls. \" + v.origem[1])}<\/div><div class=\"quote\">${esc(v.origem[2])}<\/div>\n    ${v.correcao ? `<div class=\"grid2\" style=\"margin-top:12px\"><div><h3>Correção monetária<\/h3><p class=\"muted\" style=\"margin:4px 0\">${v.correcao[0]} · ${v.correcao[1]}<\/p><p class=\"help\" style=\"margin:0\">Começa no ${v.correcao[2]} ${fl(2)} · termina na data de referência<\/p>${mm(v.correcao[3], [\"Mês\", \"Dias\", \"Índice\", \"Correção\", \"Base corrigida\"])}<\/div>\n      <div><h3>Juros<\/h3><p class=\"muted\" style=\"margin:4px 0\">${v.juros[0]} · ${v.juros[1]}<\/p><p class=\"help\" style=\"margin:0\">Começa no ${v.juros[2]} ${fl(2)} · termina na data de referência<\/p>${mm(v.juros[3], [\"Mês\", \"Dias\", \"Taxa\", \"Juros\"])}<\/div><\/div>` : \"\"}<\/div><\/details>`;\n}\nfunction calculo() {\n  if (!C.calc) return `<section class=\"card\" style=\"margin-top:20px\"><div class=\"card-b\"><div class=\"callout\" style=\"--c:var(--state-needs_documents)\"><i data-lucide=\"file-warning\"><\/i><div><b>A conta ainda não pode ser montada<\/b><p>${esc(p.motivo)} Assim que o documento chegar, a leitura continua e a memória aparece aqui.<\/p><a class=\"btn\" style=\"margin-top:10px\" href=\"?id=${p.id}&aba=documentos#faltam\"><i data-lucide=\"upload\"><\/i>Ver o que falta<\/a><\/div><\/div><\/div><\/section>`;\n  const m = C.calc.memoria;\n  return `${C.provision ? `<div class=\"callout\" style=\"margin-top:20px;--c:var(--state-calculated)\"><i data-lucide=\"info\"><\/i><div><b>Provisão: estimativa sem sentença<\/b> ${UI.chg(\"calc-provisao\")}<p>Feita a partir dos pedidos da petição inicial. Serve para provisionar e não é o valor de uma condenação: não é aprovada e não gera guia.<\/p><\/div><\/div>` : \"\"}\n    ${checklist()}\n    <section class=\"card\" style=\"margin-top:16px\"><div class=\"card-h\" style=\"flex-wrap:wrap\"><h2>${UI.term(C.provision ? \"Memória de provisão\" : \"Memória de cálculo\", C.provision ? \"provisao\" : \"memoria\")} · Versão ${m.versao}<\/h2>${UI.chg(\"glossario\", \"Novo: termos explicados\")}<span class=\"badge plain\" style=\"--c:var(--state-calculated)\">${m.rotulo}<\/span><span style=\"flex:1\"><\/span>\n      <button class=\"btn\" id=\"calcChat\"><i data-lucide=\"message-square-diff\"><\/i>Chat do cálculo<\/button>${UI.chg(\"chat-calculo\")}<\/div>\n      <div class=\"card-b\"><dl class=\"kv\"><div><dt>${C.provision ? \"Estimativa total\" : \"Total devido\"}<\/dt><dd class=\"money big\">${money(m.total)}<\/dd><\/div><div><dt>${UI.term(\"Parte da cliente\", \"parte\")}<\/dt><dd class=\"money big\">${money(m.parte)}<\/dd><\/div><div><dt>${UI.term(\"Data de referência\", \"dataref\")}<\/dt><dd>${m.ref} <button class=\"link\" style=\"font-size:12px\" onclick=\"UI.toast('Protótipo: escolher nova data; gera uma versão nova.')\">Alterar<\/button><\/dd><\/div><div><dt>Responsabilidade<\/dt><dd>Direta<\/dd><\/div><\/dl>\n      <div class=\"row\" style=\"margin-top:16px;flex-wrap:wrap\"><button class=\"btn\"><i data-lucide=\"sheet\"><\/i>Baixar planilha<\/button><button class=\"btn\"><i data-lucide=\"file-down\"><\/i>Baixar PDF<\/button><span style=\"flex:1\"><\/span><button class=\"btn ghost\"><i data-lucide=\"history\"><\/i>Versões (${m.versao})<\/button><button class=\"btn ghost\"><i data-lucide=\"git-compare\"><\/i>Comparar versões<\/button><\/div><\/div><\/section>\n    <section style=\"margin-top:20px\"><div class=\"row\" style=\"margin-bottom:10px\"><h2>${UI.term(\"Verbas\", \"verba\")} ${UI.chg(\"calc-verbas\")}<\/h2><span class=\"help\">${C.calc.verbas.length} ${C.calc.verbas.length === 1 ? \"verba\" : \"verbas\"} · clique para ver a origem e a conta mês a mês<\/span><\/div>\n      ${C.calc.verbas.length ? C.calc.verbas.map(verbaHtml).join(\"\") : `<div class=\"card card-b muted\">Nenhuma verba com valor: a sentença não condena a cliente.<\/div>`}\n      <div class=\"card\" style=\"margin-top:12px;padding:14px 16px;box-shadow:none\"><div class=\"row\"><b style=\"flex:1\">${C.provision ? \"Estimativa total (não gera guia)\" : \"Total devido · base para a guia\"}<\/b><span class=\"money big\">${money(m.total)}<\/span><\/div><\/div><\/section>\n    <details class=\"card\" style=\"margin-top:16px\"><summary class=\"card-b\" style=\"cursor:pointer\"><b>Evolução por fase<\/b> <span class=\"help\">· quanto o valor mudou da inicial até o título vigente<\/span><\/summary><div class=\"card-b\" style=\"padding-top:0\"><div class=\"phase\">${C.calc.fases.map(([f, d, v, n]) => `<div class=\"card\"><span class=\"help\">${f} · ${d}<\/span><div class=\"money\" style=\"font-size:18px;margin-top:4px\">${money(v)}<\/div><div class=\"help\">${n}<\/div><\/div>`).join(\"\")}<\/div><\/div><\/details>\n    ${!C.provision ? `<section class=\"card\" id=\"guia\" style=\"margin-top:16px\"><div class=\"card-b row\"><i data-lucide=\"receipt\"><\/i><div style=\"flex:1\"><b>${UI.term(\"Guia de pagamento\", \"guia\")}<\/b><div class=\"help\">Liberada depois da aprovação. A guia é emitida no tribunal; o comprovante aparece aqui quando o pagamento for identificado.<\/div><\/div><button class=\"btn\" disabled>Pedir guia<\/button><\/div><\/section>` : \"\"}`;\n}\nfunction historico() {\n  const h = C.historico.length ? C.historico : [[p.data, \"Última mudança registrada\", D.TEAM[p.resp].nome]];\n  return `<section class=\"card\" style=\"margin-top:20px\"><div class=\"card-h\"><h2>O que aconteceu com o processo ${UI.chg(\"hist-nomes\")}<\/h2><\/div><div class=\"card-b\">${h.slice().reverse().map(([d, t, w]) => `<div class=\"row\" style=\"align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)\"><span class=\"mono subtle\" style=\"width:130px;font-size:12px\">${d}<\/span><span style=\"flex:1\">${t}<\/span><span class=\"help\">${w}<\/span><\/div>`).join(\"\")}\n    <details style=\"margin-top:12px\"><summary class=\"help\" style=\"cursor:pointer\">Detalhes técnicos para o suporte<\/summary><p class=\"help\">Tarefas internas da leitura e do cálculo, com tentativas e horários. Ficam fora da vista do dia a dia.<\/p><\/details><\/div><\/section>`;\n}\n\n/* ---------- painéis laterais ---------- */\nfunction openFolha(n) {\n  const f = C.folhas[n] || [\"Autos\", \"Trecho ilustrativo da folha.\"];\n  openSide(`<div class=\"side-h\"><i data-lucide=\"file-text\"><\/i><h2 style=\"flex:1\">Autos · fl. ${n}<\/h2><button class=\"icon-btn\" data-close aria-label=\"Fechar\"><i data-lucide=\"x\"><\/i><\/button><\/div>\n    <div class=\"side-b\"><p class=\"help\" style=\"margin-top:0\">${f[0]} · o trecho usado está marcado<\/p><div class=\"page\"><div class=\"pg\">fl. ${n}<\/div>${f[1]}<\/div><\/div>\n    <div class=\"side-f row\"><button class=\"btn\" onclick=\"UI.toast('Protótipo: abre o PDF já nesta folha.')\"><i data-lucide=\"external-link\"><\/i>Abrir o PDF nesta folha<\/button><button class=\"btn ghost\"><i data-lucide=\"download\"><\/i>Baixar<\/button><\/div>`);\n}\nfunction openAsk() {\n  openSide(`<div class=\"side-h\"><i data-lucide=\"message-circle-question\"><\/i><h2 style=\"flex:1\">Perguntar sobre o processo<\/h2><button class=\"icon-btn\" data-close aria-label=\"Fechar\"><i data-lucide=\"x\"><\/i><\/button><\/div>\n    <div class=\"side-b\"><div class=\"privacy\"><i data-lucide=\"lock\"><\/i><span><b>Só você vê esta conversa.<\/b> Aqui você só pergunta: nada do processo muda.<\/span><\/div>\n      <div class=\"msg me\">Por que a conta deu zero?<\/div>\n      <div class=\"msg\">A sentença de 17/07/2026 homologou um acordo entre o autor e a TAP ${fl(87)}. A TAP pagou R$ 4.112,71 por alvará em 21/08 ${fl(102)}. A Royal Air Maroc não participou do acordo e não foi condenada.<\/div>\n      <p class=\"help\">Exemplos: Quais pedidos a sentença deferiu? · Há recurso pendente? · Qual é o total e em que data?<\/p><\/div>\n    <div class=\"side-f\"><input class=\"input\" style=\"width:100%\" placeholder=\"Pergunte sobre o processo\" aria-label=\"Pergunta\"><p class=\"help\" style=\"margin:6px 0 0\">Para mudar a conta, use o Chat do cálculo, na aba Cálculo.<\/p><\/div>`);\n}\nfunction openCalcChat() {\n  openSide(`<div class=\"side-h\"><i data-lucide=\"message-square-diff\"><\/i><h2 style=\"flex:1\">Chat do cálculo<\/h2><button class=\"icon-btn\" data-close aria-label=\"Fechar\"><i data-lucide=\"x\"><\/i><\/button><\/div>\n    <div class=\"side-b\"><div class=\"privacy\" style=\"background:color-mix(in oklch,var(--state-needs_review) 12%,transparent);color:var(--fg)\"><i data-lucide=\"users\"><\/i><span><b>Visível para toda a equipe.<\/b> Este chat altera a conta. Nada vale antes de você confirmar, e cada confirmação gera uma versão nova.<\/span><\/div>\n      <div class=\"msg me\">A citação foi em 15/09/2026, pelo AR da fl. 31.<\/div>\n      <div class=\"msg\">Mudança proposta para a verba Danos morais:<table class=\"diff\"><thead><tr><th><\/th><th>Era<\/th><th>Ficou<\/th><\/tr><\/thead><tbody><tr><td>Juros desde<\/td><td>26/08/2026<\/td><td><b>15/09/2026<\/b><\/td><\/tr><tr><td>Juros<\/td><td>R$ 237,33<\/td><td><b>R$ 168,90<\/b><\/td><\/tr><tr><td>Total<\/td><td>R$ 10.423,39<\/td><td><b>R$ 10.354,96<\/b><\/td><\/tr><\/tbody><\/table>\n        <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn primary\" onclick=\"UI.confirmDialog({title:'Confirmar a mudança?',body:'<p>Gera a versão 2 da memória com juros a partir de 15/09/2026. A versão 1 continua disponível para comparar.<\/p>',ok:'Confirmar e gerar versão 2',onOk:()=>UI.toast('Protótipo: versão 2 gerada.')})\">Confirmar<\/button><button class=\"btn\">Descartar<\/button><\/div><\/div><\/div>\n    <div class=\"side-f\"><input class=\"input\" style=\"width:100%\" placeholder=\"Pergunte ou peça uma mudança na conta\" aria-label=\"Mensagem\"><\/div>`);\n}\n\n/* ---------- montagem ---------- */\n// R8: depois de resolver um item, o foco segue para o próximo pendente (e a mudança é anunciada)\nfunction nextFocus() {\n  const el = document.querySelector('input[name=cli]:checked') || document.querySelector('input[name=zero]:checked') || document.querySelector('#approve:not([disabled])') || document.querySelector('#aprovar h2');\n  if (el) { if (el.tagName === \"H2\") el.tabIndex = -1; el.focus({ preventScroll: true }); el.scrollIntoView({ block: \"center\" }); }\n}\nfunction render() {\n  const body = { visao, documentos, timeline, calculo, historico }[aba] || visao;\n  $(\"#root\").innerHTML = header() + tabs() + body() +\n    `<button class=\"ask-fab\" id=\"ask\"><i data-lucide=\"message-circle-question\"><\/i>Perguntar sobre o processo<\/button><span class=\"chg-fab\" style=\"position:fixed;right:24px;bottom:66px;z-index:21\">${UI.chg(\"chat-perguntar\", \"Mudou: chat privado ao lado\")}<\/span>\n     <div class=\"mobile-bar\">${UI.chg(\"mobile-barra\", \"Mudou\")}<a class=\"btn primary\" href=\"?id=${p.id}&aba=${C.now.cta[1]}${C.now.cta[2]}\">${esc(C.now.cta[0])}<\/a><button class=\"btn icon\" id=\"askM\" aria-label=\"Perguntar sobre o processo\"><i data-lucide=\"message-circle-question\"><\/i><\/button><\/div>`;\n  icons(); bind();\n  $(\"#askM\").onclick = openAsk;\n  // R3: a jornada é uma parada só no Tab; as setas andam entre os passos\n  const steps = $$(\".step\");\n  steps.forEach((s, i) => s.addEventListener(\"keydown\", (e) => {\n    const k = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!k) return;\n    e.preventDefault(); const n = steps[(i + k + steps.length) % steps.length]; steps.forEach((x) => (x.tabIndex = -1)); n.tabIndex = 0; n.focus(); }));\n  const cur = $(\".step.current\"); if (cur && innerWidth < 820) cur.parentElement.scrollLeft = cur.offsetLeft - 40;\n  if (window.ANCHOR) document.querySelector(window.ANCHOR)?.scrollIntoView({ block: \"start\" });\n}\nfunction bind() {\n  $$(\"[data-fl]\").forEach((b) => (b.onclick = () => openFolha(b.dataset.fl)));\n  $(\"#ask\").onclick = openAsk;\n  $(\"#calcChat\") && ($(\"#calcChat\").onclick = openCalcChat);\n  const more = $(\"#more\"), menu = $(\"#moreMenu\");\n  more.onclick = () => { menu.hidden = !menu.hidden; more.setAttribute(\"aria-expanded\", !menu.hidden); };\n  $$(\"[data-act]\", menu).forEach((b) => (b.onclick = () => { menu.hidden = true;\n    if (b.dataset.act === \"reler\") confirmDialog({ title: \"Reler os autos?\", body: \"<p>O sistema lê todos os PDFs de novo. Isso tem custo e leva alguns minutos; a memória atual vira uma versão antiga.<\/p>\", ok: \"Reler os autos\", onOk: () => toast(\"Protótipo: leitura pedida.\") });\n    else confirmDialog({ title: \"Arquivar este processo?\", body: \"<p>Ele sai das filas e do Painel, mas continua na lista com o filtro Arquivado. Dá para desfazer.<\/p>\", ok: \"Arquivar\", onOk: () => toast(\"Protótipo: processo arquivado.\") }); }));\n  $$(\"[data-mark]\").forEach((b) => (b.onclick = () => { state.cliente = /maroc/i.test(b.dataset.mark) ? \"Royal Air Maroc\" : b.dataset.mark; toast(`${b.dataset.mark} marcada como cliente.`); render(); }));\n  $(\"#cliOk\") && ($(\"#cliOk\").onclick = () => { const v = $(\"input[name=cli]:checked\").value; state.cliente = v ? (/maroc/i.test(v) ? \"Royal Air Maroc\" : v) : \"—\"; render(); nextFocus(); toast(`Cliente indicada: ${state.cliente}.`); });\n  $(\"[data-undo-cliente]\") && ($(\"[data-undo-cliente]\").onclick = () => { state.cliente = null; render(); nextFocus(); });\n  $$(\"input[name=zero]\").forEach((r) => (r.onchange = () => ($(\"#zeroValor\").hidden = r.value !== \"valor\" || !r.checked)));\n  $(\"#zeroOk\") && ($(\"#zeroOk\").onclick = () => { state.zero = $(\"input[name=zero]:checked\").value; render(); nextFocus(); toast(state.zero === \"zero\" ? \"Decisão registrada: a cliente não deve nada.\" : \"Valor registrado.\"); });\n  $(\"[data-undo-zero]\") && ($(\"[data-undo-zero]\").onclick = () => { state.zero = null; render(); nextFocus(); });\n  $(\"#citOk\") && ($(\"#citOk\").onclick = () => { if (!$(\"#cit\").value) { toast(\"Informe a data da citação.\"); $(\"#cit\").focus(); return; } openCalcChat(); });\n  $(\"#approve\") && ($(\"#approve\").onclick = () => confirmDialog({ title: state.zero === \"zero\" ? \"Aprovar e encerrar sem valor?\" : `Aprovar a versão ${C.calc.memoria.versao}?`, body: `<p>${state.zero === \"zero\" ? \"A memória com valor zero fica congelada e o processo vai para Encerrado, sem guia.\" : `A memória de ${money(C.calc.memoria.total)} fica congelada e a guia pode ser pedida.`} Para mudar depois, é preciso remover a aprovação, com um motivo.<\/p>`, ok: \"Aprovar\", onOk: () => toast(\"Protótipo: memória aprovada.\") }));\n}\nrender();\n"}, "uploads.html": {"title": "Uploads · Contencioso", "tpl": "\n  <h1>Uploads<\/h1>\n  <p class=\"muted\" style=\"margin:6px 0 0;max-width:720px\">Envie os PDFs dos autos de uma vez, até de processos diferentes. O sistema acha o número do processo em cada arquivo e põe o documento no processo certo, ou cria o processo. Quando não tiver certeza, ele pergunta aqui em cima.<\/p>\n\n  <!-- o que precisa da pessoa vem antes da área de envio (com zoom de 200% continua na primeira tela) -->\n  <section class=\"card\" style=\"margin-top:20px\" id=\"pend\" aria-labelledby=\"pT\">\n    <div class=\"card-h\"><div><h2 id=\"pT\">Aguardando sua escolha <span class=\"badge plain\" style=\"--c:var(--state-needs_documents);margin-left:6px\" id=\"pN\"><\/span> <span data-c=\"up-topo\"><\/span><\/h2><p>Arquivos em que o sistema não achou o número do processo.<\/p><\/div><\/div>\n    <div class=\"card-b\" id=\"pendList\"><\/div>\n  <\/section>\n\n  <section class=\"card\" style=\"margin-top:16px\"><div class=\"card-b\"><div class=\"drop\">\n    <i data-lucide=\"upload-cloud\" style=\"width:28px;height:28px;color:var(--brand-400)\"><\/i>\n    <h3 style=\"margin-top:8px\">Arraste os PDFs aqui<\/h3>\n    <p class=\"muted\" style=\"margin:4px 0 12px\">Pode ser de processos diferentes. Cada arquivo vai para o processo do número que está nele. Só PDF.<\/p>\n    <div class=\"row\" style=\"justify-content:center;flex-wrap:wrap\"><label class=\"field\" style=\"flex-direction:row;align-items:center\" for=\"tipo\">Tipo do envio<\/label>\n      <select class=\"select\" id=\"tipo\"><option>Processo completo<\/option><option>Peça avulsa<\/option><\/select>\n      <button class=\"btn primary\" onclick=\"UI.toast('Protótipo: abriria a escolha de arquivos.')\">Escolher arquivos<\/button><\/div><\/div><\/div><\/section>\n\n  <section class=\"card\" style=\"margin-top:16px\" aria-labelledby=\"lT\">\n    <div class=\"card-h\"><div><h2 id=\"lT\">Lendo o texto<\/h2><p>O sistema está procurando o número do processo. Esta área se atualiza sozinha.<\/p><\/div><\/div>\n    <div class=\"card-b muted\">Nenhum arquivo sendo lido agora.<\/div>\n  <\/section>\n\n  <section class=\"card\" style=\"margin-top:16px\" aria-labelledby=\"rT\">\n    <div class=\"card-h\" style=\"flex-wrap:wrap\"><div style=\"flex:1\"><h2 id=\"rT\">Resolvidos · 31 <span data-c=\"up-resolvidos\"><\/span><\/h2><p>Arquivos que já foram para um processo.<\/p><\/div>\n      <input class=\"input\" placeholder=\"Filtrar por arquivo, número ou parte\" aria-label=\"Filtrar resolvidos\" id=\"rq\" style=\"width:280px\"><\/div>\n    <div class=\"card-b\" style=\"padding-top:8px\"><div class=\"table-wrap\" style=\"border:0\"><table class=\"responsive\" id=\"res\"><\/table><\/div><\/div>\n  <\/section>\n", "js": "\nconst { $, $$, esc, badge, icons, shell, toast, confirmDialog, D, proc } = UI;\nshell(\"Uploads\");\nconst U = D.UPLOADS_PENDENTES;\n$(\"#pN\").textContent = U.length;\n$(\"#pendList\").innerHTML = U.map((u, i) => `\n  <div class=\"row\" style=\"align-items:flex-start;gap:16px;flex-wrap:wrap\">\n    <div class=\"thumb\" aria-hidden=\"true\"><b>${esc(u.trecho.slice(0, 40))}<\/b><br>${esc(u.trecho.slice(40))}<\/div>\n    <div style=\"flex:1;min-width:280px\">\n      <div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><b>${esc(u.nome)}<\/b><span class=\"help\">${u.paginas} pág. · ${u.tamanho} · enviado por ${D.TEAM[u.por].nome} em ${u.enviado}<\/span><\/div>\n      <p class=\"muted\" style=\"margin:6px 0 10px\"><i data-lucide   "lista-valor": ["Filtro por tipo de valor", "Nada separava provisão de condenação. A fase não resolvia: havia processo na fase Sentença sem cálculo.", "Filtro Provisão, Condenação ou Sem valor ainda; o tipo aparece em cada linha.", "Não dava para saber, pela lista, o que era estimativa e o que era condenação (N2, A5)."],

  "proc-cliente-topo": ["Cliente e tipo de valor no topo", "A cliente só aparecia como aviso de erro (\"cliente não identificada\").", "Selos da cliente (ou \"Cliente a indicar\") e do tipo de valor, logo abaixo do título.", "A cliente só aparecia quando dava erro; quem abria o processo não sabia logo para quem estava trabalhando (A3)."],
  "proc-mais-acoes": ["Ações de efeito grande no menu", "\"Arquivar\" ficava solto no topo, sem confirmação. \"Reler os autos\" e \"Reprocessar\" ficavam lado a lado, sem explicação.", "\"Mais ações\" com explicação e confirmação. \"Reprocessar\" saiu (era apoio de desenvolvimento, segundo o vídeo).", "\"Arquivar\" ficava ao alcance de um clique, sem confirmação, e \"Reprocessar\" era uma ferramenta de desenvolvimento (N8; vídeo do time, 12:24)."],

  "proc-contadores": ["Abas com contador de pendência", "Nada indicava em qual aba estava o problema.", "\"Cálculo 2\", \"Documentos 1\": o número mostra onde agir.", "Nada mostrava em que aba estava o problema; a pessoa abria aba por aba (C1)."],
  "visao-partes": ["Indicar a cliente nas partes", "As partes eram só leitura, com termos trabalhistas (reclamante e reclamada) em processo cível. Não havia onde dizer qual ré é a cliente.", "Autor e ré, selo \"Cliente\" e o botão \"Marcar como cliente\".", "O sistema bloqueava a aprovação por \"cliente não identificada\", mas não havia onde dizer qual ré era a cliente: a tarefa era impossível (Q2)."],

  "calc-zero": ["Conta zero com motivo e saída", "\"A conta deu zero. Confira a leitura da sentença\", sem link.", "O motivo vem com as folhas (acordo da TAP, alvará pago) e as escolhas \"encerrar sem valor\" ou \"informar valor e de onde veio\".", "O processo terminou em acordo com outra ré e já foi pago; o zero estava certo, mas a tela só oferecia \"aprove mesmo assim\" (A3, Q1; vídeo do time, 29:21)."],

  "calc-provisao": ["Provisão sem \"base para a guia\"", "A provisão mostrava \"Total final: base para a guia de pagamento\".", "\"Estimativa total (não gera guia)\". A data da citação pode ser informada no próprio item, com a fonte.", "A estimativa aparecia como \"base para a guia de pagamento\", o que ela não é (C2, Q6)."],
  "calc-verbas": ["Verbas com detalhe sob demanda", "Toda a conta mês a mês aparecia aberta (\"informação demais\", segundo o vídeo).", "Origem, correção e juros visíveis; o mês a mês fica recolhido. Aguenta o volume de verbas do trabalhista.", "O próprio time achou que o mês a mês aberto era \"informação demais\", e no trabalhista as verbas são muitas (C3; vídeo do time, 20:42)."],
  "folha-lado": ["Folha dos autos ao lado", "\"Abrir documento\" baixava o PDF inteiro. O trecho que provava a data não mostrava data nenhuma.", "Cada \"fl. N\" abre a folha num painel ao lado, com o trecho marcado. Baixar o PDF fica como segunda opção.", "Para conferir a origem de um número, era preciso baixar o PDF inteiro e sair do sistema; e o trecho citado como prova da data não mostrava data (G, Q7)."],
  "chat-perguntar": ["Chat de perguntas: privado e ao lado", "A gaveta cobria cerca de 60% da tela e era igual à do outro chat. Não dizia que a conversa é privada.", "Painel ao lado, sem cobrir a conta, com o aviso \"Só você vê esta conversa. Nada do processo muda.\"", "Os dois chats pareciam iguais e cobriam a tela; ninguém sabia que este é privado (D1, D2; vídeo do time, 22:10)."],
  "chat-calculo": ["Chat do cálculo: visível à equipe", "Não dizia que a conversa é vista por todos, e a gaveta escondia a conta que ele altera.", "Aviso \"Visível para toda a equipe\". O era → ficou aparece ao lado da memória, com confirmação que gera uma versão nova.", "Este chat altera a conta e é visto por toda a equipe, mas a tela não dizia isso (D1, D2; vídeo do time, 18:08)."],
  "docs-falta": ["\"Faltam documentos\" diz qual", "\"Envie os documentos que faltam\", sem dizer quais.", "Checklist do que falta (com a folha da sentença e onde o documento costuma estar) e do que já está ok.", "As personas liam \"faltam documentos\" e não sabiam qual documento mandar (N5)."],
  "docs-linguagem": ["Sem linguagem técnica", "\"O progresso por parte do documento ainda não é informado pela API\".", "Nome legível do documento, quem enviou, quando e se já foi lido.", "A tela falava da tecnologia (\"API\"), contra o próprio princípio do sistema (F)."],
  "tl-duvidas": ["\"Dúvidas da leitura\" no lugar de \"Revisões\"", "\"Revisões\" dizia \"nada a revisar\" enquanto o status dizia \"Precisa de revisão\".", "O nome separa as dúvidas da leitura dos pontos da conta, e aponta onde estão os da conta.", "A palavra \"revisão\" tinha dois sentidos, e a aba dizia \"nada a revisar\" quando o status dizia o contrário (A2, Q4)."],
  "tl-folha": ["Cada ato com a folha clicável", "A origem ficava escondida atrás de \"Ver o texto e onde está nos autos\".", "A folha aparece em cada ato e abre ao lado.", "Todo número deve mostrar de onde veio, mas a folha ficava escondida (G)."],

  "up-resolvidos": ["Resolvidos em tabela com filtro", "Lista corrida de 31 arquivos com nomes técnicos.", "Tabela com filtro, nome legível e o processo de destino.", "A lista corrida de 31 arquivos com nomes técnicos confundia quem tem dificuldade de foco (E3)."],
  "glossario": ["Termos explicados", "\"Memória de cálculo\", \"data de referência\", \"parte da cliente\" e \"provisão\" apareciam sem explicação.", "Os termos têm um sublinhado pontilhado: ao passar o mouse, tocar ou chegar pelo teclado, aparece a explicação do glossário do próprio guia.", "Na rodada 2, o advogado recém-chegado e a estagiária travaram no vocabulário (R2)."],
  "mobile-barra": ["Ação fixa no celular", "O botão de aprovar ficava cerca de 1.700 px abaixo do topo; a jornada cortava a etapa atual.", "A ação principal fica fixa embaixo e a jornada rola até a etapa atual.", "No celular, o botão de aprovar ficava a mais de duas telas de rolagem (N6)."],
};
</script>
<script>/* Casca do protótipo: menu, topo, tema, busca Ctrl+K, painel lateral, diálogos. */
(function () {
  const D = window.DATA;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (v) => v == null ? "—" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const proc = (id) => D.procs.find((p) => p.id === Number(id));
  const badge = (estado) => { const s = D.STATES[estado]; return `<span class="badge ${s.outline ? "outline" : ""}" style="--c:${s.c}">${s.label}</span>`; };
  const person = (key, sm = true) => { const t = D.TEAM[key]; return key === "sistema"
      ? `<span class="avatar ${sm ? "sm" : ""} sys" aria-hidden="true"><i data-lucide="cpu"></i></span>`
      : `<span class="avatar ${sm ? "sm" : ""}" aria-hidden="true">${t.ini}</span>`; };
  const valueTag = (p) => p.tipo === "prov" ? `<span class="tag">Provisão</span>` : p.tipo === "cond" ? `<span class="tag client">Condenação</span>` : `<span class="tag">Sem valor ainda</span>`;
  const clientTag = (p) => p.cliente ? `<span class="tag client"><i data-lucide="briefcase"></i>${esc(p.cliente)}</span>` : `<span class="tag" style="color:var(--state-needs_review)"><i data-lucide="circle-help"></i>Cliente a indicar</span>`;
  const icons = () => window.lucide && window.lucide.createIcons();

  const myQueue = () => D.procs.filter((p) => ["needs_review", "needs_documents", "calculated"].includes(p.estado));

  function shell(active) {
    const pend = D.UPLOADS_PENDENTES.length;
    const fila = myQueue().length + pend;
    const nav = [
      ["index.html", "gauge", "Painel", fila],
      ["processos.html", "folder", "Processos"],
      ["uploads.html", "inbox", "Uploads", pend],
      ["#", "percent", "Índices"],
      ["#", "shield", "Administração"],
      ["#", "scroll-text", "Auditoria"],
    ];
    const app = document.createElement("div");
    app.className = "app";
    app.innerHTML = `
      <a class="skip" href="#conteudo">Ir para o conteúdo</a>
      <aside class="sidebar" id="sidebar" aria-label="Menu principal">
        <div class="brand"><span class="logo">C</span>Contencioso</div>
        <nav class="nav">${nav.map(([h, ic, t, n]) => `<a href="${h}" class="${t === active ? "active" : ""}" ${t === active ? 'aria-current="page"' : ""}><i data-lucide="${ic}"></i>${t}${n ? `<span class="count" aria-label="${n} pendentes">${n}</span>` : ""}</a>`).join("")}</nav>
        <div style="padding:0 8px">${chg("menu-contador", "Mudou: contadores")}</div>
        <div class="foot"></div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" aria-label="Abrir menu" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
          <button class="search-btn" id="openSearch" aria-label="Buscar processo, cliente ou tela (Ctrl+K)"><i data-lucide="search"></i><span>Buscar processo, cliente ou tela…</span><kbd>Ctrl K</kbd></button>${chg("busca-rapida")}
          <span class="spacer"></span>
          <button class="chg-toggle" id="chgToggle" aria-pressed="true" title="Mostrar ou esconder as etiquetas do que mudou"><i data-lucide="sparkles"></i><span>O que mudou</span></button>
          <button class="icon-btn" id="chgList" aria-label="Ver a lista de mudanças desta tela"><i data-lucide="list-checks"></i></button>
          <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"><i data-lucide="monitor"></i></button>
          <button class="user" aria-label="Menu de Mariana"><span class="avatar">M</span><span class="nm">Mariana</span></button>
        </header>
        <main class="content" id="conteudo" tabindex="-1"><div class="chg-banner" id="chgBanner"><i data-lucide="sparkles" style="color:var(--note)"></i><span><b>Protótipo do redesenho.</b> As etiquetas <span class="chg" style="display:inline-flex;cursor:default"><i data-lucide="sparkles"></i>Mudou</span> marcam o que mudou na experiência: clique para ver o antes, o agora e o porquê. Use <b>O que mudou</b>, no topo, para esconder.</span></div></main>
      </div>
      <aside class="side" id="side" hidden role="region" aria-label="Painel lateral"></aside>
      <div class="term-pop" id="termPop" role="tooltip" hidden></div>
      <div class="overlay" id="pal" hidden><div class="palette" role="dialog" aria-label="Busca rápida">
        <div class="in-wrap"><i data-lucide="search"></i><input id="palIn" placeholder="Número, parte, cliente ou tela" aria-label="Buscar"></div>
        <div class="res" id="palRes" role="listbox"></div></div></div>
      <div class="overlay" id="dlg" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>`;
    document.body.prepend(app);
    const main = $("#conteudo");
    $$("body > template, body > .page-content").forEach((n) => main.append(n.content ? n.content.cloneNode(true) : n));
    $$("[data-c]", main).forEach((el) => (el.outerHTML = chg(el.dataset.c, el.dataset.l || "Mudou")));
    bindTheme(); bindPalette(); bindChanges(); bindTerms();
    return main;
  }

  /* Etiquetas "O que mudou" */
  const chg = (key, label = "Mudou") => window.CHANGES && window.CHANGES[key]
    ? `<button type="button" class="chg" data-chg="${key}" aria-label="O que mudou: ${esc(window.CHANGES[key][0])}"><i data-lucide="sparkles"></i>${esc(label)}</button>` : "";
  function bindChanges() {
    let on = localStorageGet("chg") !== "off";
    const apply = () => { document.body.classList.toggle("show-chg", on); $("#chgToggle").setAttribute("aria-pressed", on); $("#chgBanner").hidden = !on; };
    $("#chgToggle").onclick = () => { on = !on; localStorageSet("chg", on ? "on" : "off"); apply(); };
    apply();
    const pop = document.createElement("div"); pop.className = "chg-pop"; pop.hidden = true; pop.setAttribute("role", "dialog"); document.body.append(pop);
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-chg]");
      if (!b) { if (!e.target.closest(".chg-pop")) pop.hidden = true; return; }
      e.preventDefault(); e.stopPropagation();
      const [t, antes, agora, pq] = window.CHANGES[b.dataset.chg];
      pop.innerHTML = `<h3><i data-lucide="sparkles"></i>${esc(t)}</h3><dl><div><dt>Antes</dt><dd class="antes">${esc(antes)}</dd></div><div><dt>Agora</dt><dd>${esc(agora)}</dd></div><div><dt>Por quê</dt><dd class="muted">${esc(pq)}</dd></div></dl>`;
      pop.hidden = false; icons();
      const r = b.getBoundingClientRect(); const w = pop.offsetWidth;
      pop.style.top = (r.bottom + scrollY + 6) + "px";
      pop.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - w - 8)) + "px";
    }, true);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") pop.hidden = true; });
    $("#chgList").onclick = () => {
      const keys = [...new Set($$("[data-chg]").map((b) => b.dataset.chg))];
      openSide(`<div class="side-h"><i data-lucide="list-checks" style="color:var(--note)"></i><h2 style="flex:1">O que mudou nesta tela · ${keys.length}</h2><button class="icon-btn" data-close aria-label="Fechar"><i data-lucide="x"></i></button></div>
        <div class="side-b chg-list">${keys.map((k) => { const [t, antes, agora, pq] = window.CHANGES[k]; return `<a href="#" data-goto="${k}"><b>${esc(t)}</b><div class="help" style="margin-top:4px"><span class="antes">Antes: ${esc(antes)}</span></div><div style="margin-top:4px;font-size:13px">Agora: ${esc(agora)}</div><div class="help" style="margin-top:4px">${esc(pq)}</div></a>`; }).join("")}</div>`);
      $$("[data-goto]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); const t = $(`.main [data-chg="${a.dataset.goto}"]`) || $(`[data-chg="${a.dataset.goto}"]`); if (!t) return; t.scrollIntoView({ block: "center" }); const host = t.parentElement; host.classList.add("chg-target"); setTimeout(() => host.classList.remove("chg-target"), 1800); }));
    };
  }

  function bindTheme() {
    const order = ["system", "dark", "light"]; const ic = { system: "monitor", dark: "moon", light: "sun" };
    let cur = localStorageGet("theme") || "system";
    const apply = () => { if (cur === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = cur;
      $("#themeBtn").innerHTML = `<i data-lucide="${ic[cur]}"></i>`; $("#themeBtn").setAttribute("aria-label", `Tema: ${({ system: "do sistema", dark: "escuro", light: "claro" })[cur]}. Alternar`); icons(); };
    $("#themeBtn").onclick = () => { cur = order[(order.indexOf(cur) + 1) % 3]; localStorageSet("theme", cur); apply(); };
    apply();
  }
  function localStorageGet(k) { try { return localStorage.getItem("ctv2-" + k); } catch (e) { return null; } }
  function localStorageSet(k, v) { try { localStorage.setItem("ctv2-" + k, v); } catch (e) {} }

  /* Busca rápida: agora encontra processo por número, parte ou cliente (antes só levava às telas). */
  function bindPalette() {
    const pal = $("#pal"), inp = $("#palIn"), res = $("#palRes");
    const screens = [["Painel", "index.html", "gauge"], ["Processos", "processos.html", "folder"], ["Uploads", "uploads.html", "inbox"], ["Índices", "#", "percent"], ["Minha conta", "#", "user"]];
    const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
    const render = () => {
      const q = norm(inp.value);
      let html = "";
      if (q) {
        const clients = D.CLIENT_NAMES.filter((c) => norm(c).includes(q) || D.procs.some((p) => p.sugestao === c && norm(p.reus).includes(q)));
        const ps = D.procs.filter((p) => norm(p.numero).includes(q) || norm(p.titulo).includes(q) || norm(p.cliente || "").includes(q)).slice(0, 8);
        if (clients.length) html += `<div class="grp">Clientes</div>` + clients.map((c) => `<a href="processos.html?cliente=${encodeURIComponent(c)}"><i data-lucide="briefcase"></i>${esc(c)}<span class="subtle" style="margin-left:auto">${D.procs.filter((p) => p.sugestao === c).length} processos</span></a>`).join("");
        if (ps.length) html += `<div class="grp">Processos</div>` + ps.map((p) => `<a href="processo.html?id=${p.id}"><span class="mono" style="font-size:12px">${p.numero}</span><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.autor)}</span><span style="margin-left:auto">${badge(p.estado)}</span></a>`).join("");
      }
      const sc = screens.filter(([t]) => !q || norm(t).includes(q));
      if (sc.length) html += `<div class="grp">Ir para</div>` + sc.map(([t, h, ic]) => `<a href="${h}"><i data-lucide="${ic}"></i>${t}</a>`).join("");
      res.innerHTML = html || `<div class="empty">Nada com "${esc(inp.value)}". Tente o número do processo (pode ser só um pedaço), o nome de uma parte ou da cliente.</div>`;
      const first = $("a", res); if (first) first.setAttribute("aria-selected", "true");
      icons();
    };
    const open = () => { pal.hidden = false; inp.value = ""; render(); inp.focus(); };
    $("#openSearch").onclick = open;
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); open(); }
      if (e.key === "Escape") { if (!$("#dlg").hidden) closeDialog(); else if (!pal.hidden) pal.hidden = true; else if (!$("#side").hidden && !document.querySelector(".chg-pop:not([hidden])")) closeSide(); }
    });
    pal.addEventListener("click", (e) => { if (e.target === pal) pal.hidden = true; });
    inp.addEventListener("input", render);
    inp.addEventListener("keydown", (e) => {
      const items = $$("a", res); let i = items.findIndex((a) => a.getAttribute("aria-selected") === "true");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[i]?.removeAttribute("aria-selected"); i = (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items[i].setAttribute("aria-selected", "true"); items[i].scrollIntoView({ block: "nearest" }); }
      if (e.key === "Enter" && items[i]) window.go(items[i].getAttribute("href"));
    });
  }

  /* Painel lateral: empurra o conteúdo em vez de cobrir (os chats e a folha ficam ao lado da conta). */
  let sideOpener = null;
  /* R1: ao abrir, o foco vai para o painel; Esc fecha e devolve o foco a quem abriu. */
  function openSide(html) { const s = $("#side"); if (s.hidden) sideOpener = document.activeElement; s.innerHTML = html; s.hidden = false; $(".app").classList.add("with-panel"); icons();
    $("[data-close]", s)?.addEventListener("click", closeSide);
    const h = $("h2", s); if (h) { s.setAttribute("aria-label", h.textContent.trim()); h.tabIndex = -1; h.focus({ preventScroll: true }); } }
  function closeSide() { const s = $("#side"); s.hidden = true; s.innerHTML = ""; $(".app").classList.remove("with-panel"); if (sideOpener && document.contains(sideOpener)) sideOpener.focus({ preventScroll: true }); sideOpener = null; }

  /* R2: termos do sistema com explicação curta (glossário do guia do cliente). */
  const GLOSS = {
    memoria: ["Memória de cálculo", "A conta de quanto a cliente deve, item a item, com correção e juros mês a mês. Cada mudança gera uma versão nova."],
    provisao: ["Provisão", "Estimativa feita antes da sentença, a partir dos pedidos. Serve para planejar; não é aprovada e não gera guia."],
    dataref: ["Data de referência", "A data até a qual a conta é atualizada. O ideal é a data em que o valor será pago."],
    parte: ["Parte da cliente", "Quanto do total cabe à cliente quando há outras empresas condenadas junto."],
    verba: ["Verba", "Cada item da condenação, como danos morais, custas ou honorários."],
    guia: ["Guia", "O boleto judicial para pagar o valor aprovado."],
    total: ["Total devido", "A soma de todas as verbas, corrigidas e com juros até a data de referência."],
  };
  const term = (label, key) => GLOSS[key] ? `<span class="term" tabindex="0" data-term="${key}" aria-describedby="termPop">${esc(label)}</span>` : esc(label);
  function bindTerms() {
    const pop = $("#termPop");
    const show = (el) => { const [t, d] = GLOSS[el.dataset.term]; pop.innerHTML = `<b>${esc(t)}</b><br>${esc(d)}`; pop.hidden = false;
      const r = el.getBoundingClientRect(); pop.style.top = (r.bottom + scrollY + 6) + "px"; pop.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8)) + "px"; };
    const hide = () => (pop.hidden = true);
    document.addEventListener("mouseover", (e) => { const t = e.target.closest("[data-term]"); if (t) show(t); });
    document.addEventListener("mouseout", (e) => { if (e.target.closest("[data-term]")) hide(); });
    document.addEventListener("focusin", (e) => { const t = e.target.closest("[data-term]"); t ? show(t) : hide(); });
    document.addEventListener("click", (e) => { const t = e.target.closest("[data-term]"); t ? show(t) : hide(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  }

  function confirmDialog({ title, body, ok = "Confirmar", danger = false, onOk }) {
    const d = $("#dlg");
    d.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${title}</h2><div>${body}</div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-x>Cancelar</button><button class="btn ${danger ? "danger" : "primary"}" data-ok>${ok}</button></div></div>`;
    d.hidden = false; icons();
    $("[data-x]", d).onclick = closeDialog; $("[data-ok]", d).onclick = () => { closeDialog(); onOk && onOk(); };
    $("[data-ok]", d).focus();
  }
  function closeDialog() { const d = $("#dlg"); if (d) { d.hidden = true; d.innerHTML = ""; } }
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => (el.hidden = true), 3200); }

  window.UI = { chg, term, $, $$, esc, money, proc, badge, person, valueTag, clientTag, icons, shell, openSide, closeSide, confirmDialog, toast, myQueue, D };
})();
</script>
<script>
(function () {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, "")) || "index.html";
  let [path, rest = ""] = raw.split("?");
  if (!window.PAGES[path]) path = "index.html";
  const [qs, anchor = ""] = rest.split("#");
  window.QS = qs ? "?" + qs : "";
  window.ANCHOR = anchor ? "#" + anchor : "";
  window.CUR_PAGE = path;
  window.go = function (href) {
    const target = href.startsWith("?") ? path + href : href;
    location.hash = "/" + target;
  };
  // links entre as telas viram rotas dentro deste arquivo; âncoras rolam sem trocar a rota
  document.addEventListener("click", function (e) {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a || e.defaultPrevented) return;
    const h = a.getAttribute("href");
    if (/^(index|processos|processo|uploads)\.html/.test(h) || h.startsWith("?")) { e.preventDefault(); window.go(h); }
    else if (h === "#") e.preventDefault();
    else if (h.startsWith("#")) { e.preventDefault(); const t = document.querySelector(h); if (t) { t.scrollIntoView({ block: "start" }); if (t.tabIndex < 0 && !t.hasAttribute("tabindex")) t.tabIndex = -1; t.focus({ preventScroll: true }); } }
  }, true);
  // voltar, avançar ou editar o endereço troca a tela
  window.addEventListener("hashchange", function () { location.reload(); });
  try { history.scrollRestoration = "manual"; } catch (e) {}
  const P = window.PAGES[path];
  document.title = P.title + " · protótipo";
  const t = document.createElement("template"); t.innerHTML = P.tpl; document.body.prepend(t);
  const s = document.createElement("script"); s.textContent = P.js; document.body.append(s);
  if (window.ANCHOR) setTimeout(function () { const el = document.querySelector(window.ANCHOR); if (el) el.scrollIntoView({ block: "start" }); }, 80);
})();
</script>
